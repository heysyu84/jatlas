name: Verify Kyushu canonical-only
on:
  push:
    branches: [main]
    paths:
      - 'audits/kyushu-migration-completion.json'
      - 'dist/photo-registry-data.js'
      - 'dist/images/regions/kyushu/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Kyushu canonical runtime
        run: node tools/test-kyushu-canonical-only.cjs
      - name: Install jsdom for DOM regression
        run: npm install --prefix /tmp/jatlas-jsdom jsdom@26.1.0
      - name: Run DOM regression
        env:
          JATLAS_JSDOM: /tmp/jatlas-jsdom/node_modules/jsdom
        run: node tools/test-dom.cjs
