name: Localize selected Flickr photos

on:
  push:
    paths:
      - '.github/workflows/localize-selected-flickr.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and optimize approved Flickr photos
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps

          root = Path(".")
          out = root / "dist" / "images" / "licensed"
          out.mkdir(parents=True, exist_ok=True)

          assets = [
              (
                  "https://live.staticflickr.com/65535/54360037444_57170d3ec8_o.jpg",
                  out / "yasui-gorge-nakashi-54360037444.webp",
              ),
              (
                  "https://live.staticflickr.com/3886/14909320636_80615e058b_o.jpg",
                  out / "miyazawa-kenji-museum-yoshihide-14909320636.webp",
              ),
              (
                  "https://prcdn.freetls.fastly.net/release_image/149148/2/149148-2-54e2b5a3cb53c038c553d90114ada39e-3900x3349.jpg?auto=webp&fit=bounds&format=jpeg&width=1600",
                  out / "hotaruika-sea-tour-namerikawa-2025.webp",
              ),
              (
                  "https://www.nagasaki-tabinet.com/storage/tourism_attractions/130/responsive_images/xAa9VBOpfPTPqUznIlEEGbYe7QxJps2HTUyaZ1kR__1673_1115.jpeg",
                  out / "nagasaki-peace-statue-official.webp",
              ),
              (
                  "https://www.benesse-artsite.jp/art/uploads/art/arthouse/haisya_1.jpg",
                  out / "naoshima-haisha-benesse.webp",
              ),
          ]

          for url, dest in assets:
              if "staticflickr.com" in url:
                  referer = "https://www.flickr.com/"
              elif "prcdn.freetls.fastly.net" in url:
                  referer = "https://prtimes.jp/"
              elif "nagasaki-tabinet.com" in url:
                  referer = "https://www.nagasaki-tabinet.com/"
              elif "benesse-artsite.jp" in url:
                  referer = "https://www.benesse-artsite.jp/"
              else:
                  referer = ""
              headers = {
                  "User-Agent": "Mozilla/5.0 Jatlas photo localizer",
                  "Referer": referer,
              }
              r = requests.get(url, headers=headers, timeout=60)
              r.raise_for_status()
              ctype = (r.headers.get("content-type") or "").lower()
              if "image/" not in ctype:
                  raise RuntimeError(f"Not an image: {url} ({ctype})")
              tmp = dest.with_suffix(".download")
              tmp.write_bytes(r.content)
              with Image.open(tmp) as im:
                  im = ImageOps.exif_transpose(im)
                  if im.mode not in ("RGB", "RGBA"):
                      im = im.convert("RGB")
                  elif im.mode == "RGBA":
                      bg = Image.new("RGB", im.size, "white")
                      bg.paste(im, mask=im.getchannel("A"))
                      im = bg
                  im.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
                  im.save(dest, "WEBP", quality=86, method=6)
              tmp.unlink(missing_ok=True)
              print(dest, dest.stat().st_size)
          PY

      - name: Switch site data to local photos and bust caches
        run: |
          python - <<'PY'
          from pathlib import Path

          kochi = Path("dist/kochi-expansion.js")
          s = kochi.read_text(encoding="utf-8")
          old = "src:'https://live.staticflickr.com/65535/54360037444_57170d3ec8_o.jpg'"
          new = "src:'images/licensed/yasui-gorge-nakashi-54360037444.webp'"
          if old not in s and new not in s:
              raise RuntimeError("Yasui photo override not found")
          s = s.replace(old, new)
          kochi.write_text(s, encoding="utf-8")

          iwate = Path("dist/iwate-expansion.js")
          s = iwate.read_text(encoding="utf-8")
          old = "src:'https://live.staticflickr.com/3886/14909320636_80615e058b_o.jpg'"
          new = "src:'images/licensed/miyazawa-kenji-museum-yoshihide-14909320636.webp'"
          if old not in s and new not in s:
              raise RuntimeError("Miyazawa photo override not found")
          s = s.replace(old, new)
          iwate.write_text(s, encoding="utf-8")

          toyama = Path("dist/toyama-expansion.js")
          s = toyama.read_text(encoding="utf-8")
          old = 'src:"https://prcdn.freetls.fastly.net/release_image/149148/2/149148-2-54e2b5a3cb53c038c553d90114ada39e-3900x3349.jpg?auto=webp&fit=bounds&format=jpeg&width=1600"'
          new = 'src:"images/licensed/hotaruika-sea-tour-namerikawa-2025.webp"'
          if old not in s and new not in s:
              raise RuntimeError("Hotaruika photo override not found")
          s = s.replace(old, new)
          toyama.write_text(s, encoding="utf-8")

          nagasaki = Path("dist/nagasaki-expansion.js")
          s = nagasaki.read_text(encoding="utf-8")
          old = 'src:"https://www.nagasaki-tabinet.com/storage/tourism_attractions/130/responsive_images/xAa9VBOpfPTPqUznIlEEGbYe7QxJps2HTUyaZ1kR__1673_1115.jpeg"'
          new = 'src:"images/licensed/nagasaki-peace-statue-official.webp"'
          if old not in s and new not in s:
              raise RuntimeError("Nagasaki Peace photo override not found")
          s = s.replace(old, new)
          nagasaki.write_text(s, encoding="utf-8")

          kagawa = Path("dist/kagawa-expansion.js")
          s = kagawa.read_text(encoding="utf-8")
          old = 'src:"https://www.benesse-artsite.jp/art/uploads/art/arthouse/haisya_1.jpg"'
          new = 'src:"images/licensed/naoshima-haisha-benesse.webp"'
          if old not in s and new not in s:
              raise RuntimeError("Naoshima Haisha photo override not found")
          s = s.replace(old, new)
          kagawa.write_text(s, encoding="utf-8")

          index = Path("dist/index.html")
          s = index.read_text(encoding="utf-8")
          s = s.replace(
              '<script defer src="kochi-expansion.js"></script>',
              '<script defer src="kochi-expansion.js?v=20261004-photo2"></script>'
          )
          s = s.replace(
              '<script defer src="iwate-expansion.js?v=20261004-photo1"></script>',
              '<script defer src="iwate-expansion.js?v=20261004-photo2"></script>'
          )
          s = s.replace('<script defer src="toyama-expansion.js"></script>', '<script defer src="toyama-expansion.js?v=20261005-photo1"></script>')
          s = s.replace('<script defer src="nagasaki-expansion.js"></script>', '<script defer src="nagasaki-expansion.js?v=20261005-photo1"></script>')
          s = s.replace('<script defer src="kagawa-expansion.js"></script>', '<script defer src="kagawa-expansion.js?v=20261005-photo1"></script>')
          s = s.replace(
              '<p><a target="_blank" rel="noopener" href="https://www.flickr.com/photos/123717325@N02/14932317465/">Yoshihide Urushihara · 미야자와 겐지 기념관 · CC BY-SA 2.0</a></p>',
              '<p><a target="_blank" rel="noopener" href="https://www.flickr.com/photos/nakashi/54360037444/">nakashi · 야스이계곡 · CC BY-SA 2.0</a></p><p><a target="_blank" rel="noopener" href="https://www.flickr.com/photos/123717325@N02/14909320636/">Yoshihide Urushihara · 미야자와 겐지 기념관 · CC BY-SA 2.0</a></p>'
          )
          index.write_text(s, encoding="utf-8")
          PY

      - name: Commit localized photos
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/kochi-expansion.js dist/iwate-expansion.js dist/toyama-expansion.js dist/nagasaki-expansion.js dist/kagawa-expansion.js dist/index.html dist/images/licensed
          git commit -m "Localize approved representative photos"
          git pull --rebase origin main
          git push

      - name: Deploy latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
