name: Verify Jatlas photo runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-photo-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print final runtime photo mappings
        run: |
          node tools/audit-content.cjs /tmp/runtime.json
          node <<'NODE'
          const r=require('/tmp/runtime.json');
          const names=[
            '류즈 폭포','시마 온천','다카사키 백의대관음','요코하마 마린타워','엔가쿠지',
            '쇼묘 폭포','구로베댐','오바마 어항','구조하치만성','신호타카 로프웨이',
            '세키가하라 고전장','세키가하라 고전장 결전지','이가류 닌자박물관','오카게요코초','나가시마 스파랜드',
            '아라시야마 대나무숲','긴카쿠지','금각사','구로몬 시장','오사카성 공원·천수각','시텐노지','유니버설 스튜디오 재팬',
            '기노사키 온천','아와지 하나사지키','아카시성','고베 포트타워','요시노산','아스카데라','단잔 신사',
            '오유노하라','나치 폭포','가이케 온천','아다치 미술관','류겐지 마부','히로시마성','가라토 시장',
            '야시마·야시마루','쇼도시마 올리브공원','다카마쓰 마루가메마치 상점가','반스이소','가류산소','고치성',
            '고쿠라성','캐널시티 하카타','니지노마쓰바라','히젠 나고야성터','사가현립 규슈도자문화관','오카와치야마',
            '오우라 천주당','일본26성인 순교지','히라도 자비에르기념교회','후쿠에성터','유노쓰보거리',
            '나가유온천','오카성터','우사신궁','다카치호 협곡','우마가세','다카치호가와라','시라타니운스이쿄',
            '조몬스기','오코노타키','세이화우타키','오키나와월드','헤도곶','유글레나몰'
          ];
          const norm=s=>String(s||'').replace(/[·・\s()（）,/·]/g,'');
          const rows=r.places.filter(p=>names.some(n=>norm(p.name).includes(norm(n))||norm(n).includes(norm(p.name))))
            .map(p=>({id:p.id,pref:p.pref,area:p.area,name:p.name,src:p.photo?.src||null,fit:p.photo?.fit||null,source:p.photo?.source||null}));
          console.log('PHOTO_RUNTIME_BEGIN');
          console.log(JSON.stringify(rows,null,2));
          console.log('PHOTO_RUNTIME_END');
          console.log('HERO_RUNTIME_BEGIN');
          console.log(JSON.stringify(Object.fromEntries(Object.entries(r.heroes).filter(([k])=>['시마 온천','세키가하라·요로','기후·구조','히다·다카야마'].includes(k))),null,2));
          console.log('HERO_RUNTIME_END');
          NODE
