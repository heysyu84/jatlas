name: Migrate Koshinetsu canonical photos

on:
  push:
    branches: [main]
    paths:
      - tools/migrate-koshinetsu-canonical.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: jatlas-koshinetsu-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install Pillow==11.3.0
          npm install --prefix /tmp/jatlas-jsdom jsdom@26.1.0
      - name: Wait for triggering commit to become the deployment baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(git rev-parse HEAD)"
          echo "$BASE" > /tmp/koshinetsu-base-sha
          for i in $(seq 1 90); do
            RESULT="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=30" | jq -r --arg sha "$BASE" '[.workflow_runs[] | select(.name=="Deploy Jatlas to GitHub Pages" and .head_sha==$sha)][0] | if . == null then "pending" else (.conclusion // .status // "pending") end')"
            echo "Pages baseline $BASE: $RESULT"
            if [ "$RESULT" = "success" ]; then exit 0; fi
            if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Capture pre-migration runtime
        run: node tools/audit-content.cjs /tmp/koshinetsu-before.json
      - name: Migrate and recover Koshinetsu photos
        run: python tools/migrate-koshinetsu-canonical.py
      - name: Capture post-migration runtime
        run: node tools/audit-content.cjs /tmp/koshinetsu-after.json
      - name: Declare exact runtime changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/koshinetsu-before.json').read_text());after=json.loads(Path('/tmp/koshinetsu-after.json').read_text())
          base=Path('/tmp/koshinetsu-base-sha').read_text().strip()
          bm={int(x['id']):x for x in before['places']};am={int(x['id']):x for x in after['places']}
          photo=[]
          for ident in sorted(set(bm)&set(am)):
              a=(bm[ident].get('photo') or {}).get('src','');b=(am[ident].get('photo') or {}).get('src','')
              if a!=b:photo.append({'id':ident,'fromSrc':a,'toSrc':b})
          hero=[]
          for key in sorted(set(before.get('heroes',{}))|set(after.get('heroes',{}))):
              a=(before.get('heroes',{}).get(key) or {}).get('src','');b=(after.get('heroes',{}).get(key) or {}).get('src','')
              if a!=b:hero.append({'key':key,'fromSrc':a,'toSrc':b})
          Path('tools/content-change-intent.json').write_text(json.dumps({
            'version':1,'baseCommit':base,
            'reason':'Migrate Koshinetsu to canonical IDs/paths, preserve deduplicated Yamanashi IDs, and recover approved missing photo assets.',
            'allow':{'placeAdds':[],'placeRemovals':[],'placeEdits':[],'photoChanges':photo,'heroChanges':hero,'canonicalPhotoChanges':[]}
          },ensure_ascii=False,indent=2)+'\n')
          print('Declared photoChanges=',len(photo),'heroChanges=',len(hero))
          PY
      - name: Validate generated runtime
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          t=Path('dist/photo-registry-data.js').read_text();p='globalThis.JATLAS_PHOTO_REGISTRY_DATA='
          r=json.loads(t[len(p):].rstrip().rstrip(';'));prefs={'니가타','야마나시','나가노'}
          ps=[x for x in r['places'].values() if x['pref'] in prefs];fs=[x for x in r['foods'].values() if x['pref'] in prefs]
          assert len(ps)==79;assert len(fs)==24
          for x in ps+fs:
              f=Path('dist')/x['image'];assert f.is_file(),x['image']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==x['sha256'],x['canonicalId']
              assert re.fullmatch(r'(15|19|20)-[PF]\d{4}',x['canonicalId']),x['canonicalId']
              b=f.read_bytes()[:12];assert b[:4]==b'RIFF' and b[8:12]==b'WEBP',x['image']
          print('Koshinetsu canonical files verified:',len(ps)+len(fs))
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/regions/koshinetsu dist/images/licensed dist/photo-registry-data.js dist/index.html README.md audits/koshinetsu-migration-completion.json tools/content-change-intent.json
          if git diff --cached --quiet; then echo "No migration changes";exit 0;fi
          git commit -m "Migrate Koshinetsu photos to canonical structure"
      - name: Run regression guard on migration commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/regression-guard.cjs
      - name: Push migration
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
