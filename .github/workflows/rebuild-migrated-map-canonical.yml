name: Rebuild migrated canonical maps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-migrated-map-canonical.yml'
      - 'tools/build-migrated-map-canonical.py'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current runtime inventory
        run: node tools/audit-content.cjs
      - name: Resolve current map targets
        run: python3 tools/audit-maps.py
      - name: Build canonical targets for migrated regions
        run: python3 tools/build-migrated-map-canonical.py
      - name: Run map regression tests
        run: node tools/test-map-photo.cjs
      - name: Commit generated canonical map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/map-canonical-data.js audits/map-audit.json audits/*-map-canonical-review.json audits/regression-tests.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Canonicalize migrated region map targets"
            git push
          fi
