name: Find Namerikawa Commons photos

on:
  push:
    paths:
      - '.github/workflows/find-namerikawa-commons.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const https=require('https');
            function get(url){return new Promise((resolve,reject)=>https.get(url,{headers:{'User-Agent':'Jatlas-photo-search/1.0'}},res=>{let d='';res.setEncoding('utf8');res.on('data',x=>d+=x);res.on('end',()=>resolve(d));}).on('error',reject));}
            const base='https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggsprimary=all&ggsnamespace=6&ggsradius=1500&ggscoord=36.7794%7C137.3290&ggslimit=100&prop=imageinfo%7Ccoordinates&iiprop=url%7Csize%7Cextmetadata&format=json&origin=*';
            const raw=await get(base);
            const j=JSON.parse(raw);
            const rows=Object.values(j.query?.pages||{}).map(p=>{
              const ii=p.imageinfo?.[0]||{}, em=ii.extmetadata||{}, c=p.coordinates?.[0]||{};
              return {
                title:p.title,
                width:ii.width,height:ii.height,
                lat:c.lat,lon:c.lon,
                url:ii.thumburl||ii.url,
                file:ii.descriptionurl,
                desc:(em.ImageDescription?.value||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,240),
                artist:(em.Artist?.value||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,120),
                license:em.LicenseShortName?.value||'',
                cats:(em.Categories?.value||'').slice(0,200)
              };
            }).filter(x=>x.width>=1000&&x.height>=650&&x.width>x.height);
            for(const x of rows) console.log('CAND',JSON.stringify(x));
