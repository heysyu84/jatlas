name: Cleanup photo artifacts

on:
  push:
    branches: [main]
    paths:
      - 'tools/cleanup-photo-artifacts.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jatlas-photo-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image audit dependency
        run: python -m pip install Pillow==11.3.0

      - name: Build reviewed runtime and prepare deploy-only assets
        run: |
          python tools/build-photo-qa.py
          python tools/prepare-official-photos.py
          node tools/audit-content.cjs audits/runtime-before-cleanup.json

      - name: Remove unused photo artifacts and stale mappings
        run: |
          python tools/cleanup-photo-artifacts.py audits/runtime-before-cleanup.json
          python tools/build-photo-qa.py
          node tools/audit-content.cjs audits/runtime-inventory.json
          python tools/audit-photos.py
          python tools/build-photo-queue.py audits/runtime-inventory.json

      - name: Verify cleanup did not change effective site content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          root=Path('.');dist=root/'dist'
          before=json.loads((root/'audits/runtime-before-cleanup.json').read_text())
          after=json.loads((root/'audits/runtime-inventory.json').read_text())
          if before != after:
              raise SystemExit('Runtime inventory changed during photo cleanup')
          missing=[]
          def walk(v):
              if isinstance(v,dict):
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
              elif isinstance(v,str) and v.startswith('images/'):
                  p=dist/unquote(urlsplit(v).path)
                  if not p.is_file(): missing.append(v)
          walk(after)
          if missing:
              raise SystemExit('Missing active image files: '+repr(sorted(set(missing))[:20]))
          print('Runtime unchanged; all active local images exist')
          PY
          node tools/test-dom.cjs
          node tools/test-map-photo.cjs

      - name: Commit cleanup
        run: |
          rm -f audits/runtime-before-cleanup.json audits/runtime-inventory.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/commons-local-images.js dist/photo-qa-review.js tools/official-photo-assets.json audits/localized-photos.json audits/photo-audit.json audits/photo-queue.json audits/photo-cleanup-report.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          report=json.loads(Path('audits/photo-cleanup-report.json').read_text())
          for path in report['removedFiles']:
              subprocess.run(['git','add','-u','--','dist/'+path],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "Remove stale photo artifacts and refresh photo QA"
          git pull --rebase origin main
          git push
