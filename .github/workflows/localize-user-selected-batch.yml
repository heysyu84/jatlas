name: Localize user-selected Commons batch

on:
  push:
    paths:
      - '.github/workflows/localize-user-selected-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and optimize selected Commons photos
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import time
          import requests
          from PIL import Image, ImageOps

          assets = [
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Oyashirazu%2C_enkei.jpg/960px-Oyashirazu%2C_enkei.jpg",
                  "dist/images/licensed/approved/niigata-oyashirazu-4623.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Furin_tunnel_at_Kawagoe_Hikawa_Shrine_01.jpg/960px-Furin_tunnel_at_Kawagoe_Hikawa_Shrine_01.jpg",
                  "dist/images/licensed/approved/saitama-kawagoe-hikawa-502.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/%E4%BC%8A%E8%B3%80%E6%B5%81%E5%BF%8D%E8%80%85%E5%8D%9A%E7%89%A9%E9%A4%A8_1.JPG/960px-%E4%BC%8A%E8%B3%80%E6%B5%81%E5%BF%8D%E8%80%85%E5%8D%9A%E7%89%A9%E9%A4%A8_1.JPG",
                  "dist/images/licensed/approved/mie-iga-ninja-3717.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Magose_Pass_01.jpg/960px-Magose_Pass_01.jpg",
                  "dist/images/licensed/approved/mie-magose-pass-3726.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Acrobat_at_Nagashima_Spa_Land_1.jpg/960px-Acrobat_at_Nagashima_Spa_Land_1.jpg",
                  "dist/images/licensed/approved/mie-nagashima-3711.webp",
              ),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Jatlas user-selected photo localizer/1.0",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          })

          for url, dest_name in assets:
              dest = Path(dest_name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              response = None
              for attempt in range(5):
                  response = session.get(url, timeout=60)
                  if response.status_code == 200:
                      break
                  if response.status_code not in (429, 500, 502, 503, 504):
                      response.raise_for_status()
                  time.sleep((5, 10, 20, 40, 60)[attempt])
              if response is None or response.status_code != 200:
                  raise RuntimeError(f"Failed to download {url}: {getattr(response, 'status_code', None)}")
              ctype = (response.headers.get("content-type") or "").lower()
              if "image/" not in ctype:
                  raise RuntimeError(f"Not an image: {url} ({ctype})")
              tmp = dest.with_suffix(".download")
              tmp.write_bytes(response.content)
              with Image.open(tmp) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  if im.width < 600 or im.height < 400:
                      raise RuntimeError(f"Image too small: {url} -> {im.size}")
                  im.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
                  im.save(dest, "WEBP", quality=88, method=6)
              tmp.unlink(missing_ok=True)
              print(dest, dest.stat().st_size)
              time.sleep(1.5)
          PY

      - name: Commit localized images
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain dist/images/licensed/approved)" ]; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/licensed/approved
          git commit -m "Localize user-selected Commons photos batch B"
          git pull --rebase origin main
          git push origin HEAD:main
