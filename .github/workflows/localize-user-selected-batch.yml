name: Localize user-selected Commons batch

on:
  push:
    paths:
      - '.github/workflows/localize-user-selected-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and optimize selected Commons photos
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import time
          import requests
          from PIL import Image, ImageOps

          assets = [
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/USMC-090419-M-8097K-001.jpg/960px-USMC-090419-M-8097K-001.jpg",
                  "dist/images/licensed/approved/yamaguchi-akiyoshido-2405.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Himeji_Castle_with_cherry_blossoms_from_Himeji_Zoo.jpg/960px-Himeji_Castle_with_cherry_blossoms_from_Himeji_Zoo.jpg",
                  "dist/images/licensed/approved/hyogo-himeji-castle-1704.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Museum_of_Housing_and_Living_%28Osaka_Kita-ku%29_hdsr_S5_05.jpg/960px-Museum_of_Housing_and_Living_%28Osaka_Kita-ku%29_hdsr_S5_05.jpg",
                  "dist/images/licensed/approved/osaka-housing-living-423.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/Sakitsu.jpg/960px-Sakitsu.jpg",
                  "dist/images/licensed/approved/kumamoto-sakitsu-3218.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Marugame_Castle%2C_Tenshu_002.jpg/960px-Marugame_Castle%2C_Tenshu_002.jpg",
                  "dist/images/licensed/approved/kagawa-marugame-castle-2605.webp",
              ),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Jatlas user-selected photo localizer/1.0",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          })

          for url, dest_name in assets:
              dest = Path(dest_name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              response = None
              for attempt in range(5):
                  response = session.get(url, timeout=60)
                  if response.status_code == 200:
                      break
                  if response.status_code not in (429, 500, 502, 503, 504):
                      response.raise_for_status()
                  time.sleep((5, 10, 20, 40, 60)[attempt])
              if response is None or response.status_code != 200:
                  raise RuntimeError(f"Failed to download {url}: {getattr(response, 'status_code', None)}")
              ctype = (response.headers.get("content-type") or "").lower()
              if "image/" not in ctype:
                  raise RuntimeError(f"Not an image: {url} ({ctype})")
              tmp = dest.with_suffix(".download")
              tmp.write_bytes(response.content)
              with Image.open(tmp) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  if im.width < 600 or im.height < 400:
                      raise RuntimeError(f"Image too small: {url} -> {im.size}")
                  im.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
                  im.save(dest, "WEBP", quality=88, method=6)
              tmp.unlink(missing_ok=True)
              print(dest, dest.stat().st_size)
              time.sleep(1.5)
          PY

      - name: Commit localized images
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain dist/images/licensed/approved)" ]; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/licensed/approved
          git commit -m "Localize user-selected Commons photos batch D"
          git pull --rebase origin main
          git push origin HEAD:main
