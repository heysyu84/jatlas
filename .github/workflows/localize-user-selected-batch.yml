name: Localize user-selected Commons batch

on:
  push:
    paths:
      - '.github/workflows/localize-user-selected-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and optimize selected Commons photos
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import time
          import requests
          from PIL import Image, ImageOps

          assets = [
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b9/Oita-Harajiri_Falls%2C_echoing_in_the_countryside-xl.jpg/960px-Oita-Harajiri_Falls%2C_echoing_in_the_countryside-xl.jpg",
                  "dist/images/licensed/approved/oita-harajiri-3325.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Hirado_Castle_Keep.jpg/960px-Hirado_Castle_Keep.jpg",
                  "dist/images/licensed/approved/nagasaki-hirado-castle-3114.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Usuki_Stone_Buddas55.jpg/960px-Usuki_Stone_Buddas55.jpg",
                  "dist/images/licensed/approved/oita-usuki-stone-buddhas-3317.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Sekinoo_Falls_02.jpg/960px-Sekinoo_Falls_02.jpg",
                  "dist/images/licensed/approved/miyazaki-sekinoo-falls-3422.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Okinawa_Itoman_Peace_Hill_Heiwakinen_Memorial_park_hdsr_VLux5_01.jpg/960px-Okinawa_Itoman_Peace_Hill_Heiwakinen_Memorial_park_hdsr_VLux5_01.jpg",
                  "dist/images/licensed/approved/okinawa-peace-memorial-3607.webp",
              ),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Jatlas user-selected photo localizer/1.0",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          })

          for url, dest_name in assets:
              dest = Path(dest_name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              response = None
              for attempt in range(5):
                  response = session.get(url, timeout=60)
                  if response.status_code == 200:
                      break
                  if response.status_code not in (429, 500, 502, 503, 504):
                      response.raise_for_status()
                  time.sleep((5, 10, 20, 40, 60)[attempt])
              if response is None or response.status_code != 200:
                  raise RuntimeError(f"Failed to download {url}: {getattr(response, 'status_code', None)}")
              ctype = (response.headers.get("content-type") or "").lower()
              if "image/" not in ctype:
                  raise RuntimeError(f"Not an image: {url} ({ctype})")
              tmp = dest.with_suffix(".download")
              tmp.write_bytes(response.content)
              with Image.open(tmp) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  if im.width < 600 or im.height < 400:
                      raise RuntimeError(f"Image too small: {url} -> {im.size}")
                  im.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
                  im.save(dest, "WEBP", quality=88, method=6)
              tmp.unlink(missing_ok=True)
              print(dest, dest.stat().st_size)
              time.sleep(1.5)
          PY

      - name: Commit localized images
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain dist/images/licensed/approved)" ]; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/licensed/approved
          git commit -m "Localize user-selected Commons photos batch E"
          git pull --rebase origin main
          git push origin HEAD:main
