name: Localize user-selected Commons batch

on:
  push:
    paths:
      - '.github/workflows/localize-user-selected-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and optimize selected Commons photos
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import time
          import requests
          from PIL import Image, ImageOps

          assets = [
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/500px_photo_%28188688269%29.jpeg/960px-500px_photo_%28188688269%29.jpeg",
                  "dist/images/licensed/approved/okinawa-zanpa-3611.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Korakukan_2025-07_ac_%282%29.jpg/960px-Korakukan_2025-07_ac_%282%29.jpg",
                  "dist/images/licensed/approved/akita-korakukan-4420.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Aomori-Hotokegaura-xl.jpg/960px-Aomori-Hotokegaura-xl.jpg",
                  "dist/images/licensed/approved/aomori-hotokegaura-4129.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/20091011%E6%9D%BE%E5%B7%9D%E6%B5%A6.jpg/960px-20091011%E6%9D%BE%E5%B7%9D%E6%B5%A6.jpg",
                  "dist/images/licensed/approved/fukushima-matsukawaura-5221.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Oya_History_Museum_entrance_2016-05-12.jpg/960px-Oya_History_Museum_entrance_2016-05-12.jpg",
                  "dist/images/licensed/approved/tochigi-oya-history-1305.webp",
              ),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Jatlas user-selected photo localizer/1.0",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          })

          for url, dest_name in assets:
              dest = Path(dest_name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              response = None
              for attempt in range(5):
                  response = session.get(url, timeout=60)
                  if response.status_code == 200:
                      break
                  if response.status_code not in (429, 500, 502, 503, 504):
                      response.raise_for_status()
                  time.sleep((5, 10, 20, 40, 60)[attempt])
              if response is None or response.status_code != 200:
                  raise RuntimeError(f"Failed to download {url}: {getattr(response, 'status_code', None)}")
              ctype = (response.headers.get("content-type") or "").lower()
              if "image/" not in ctype:
                  raise RuntimeError(f"Not an image: {url} ({ctype})")
              tmp = dest.with_suffix(".download")
              tmp.write_bytes(response.content)
              with Image.open(tmp) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  if im.width < 600 or im.height < 400:
                      raise RuntimeError(f"Image too small: {url} -> {im.size}")
                  im.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
                  im.save(dest, "WEBP", quality=88, method=6)
              tmp.unlink(missing_ok=True)
              print(dest, dest.stat().st_size)
              time.sleep(1.5)
          PY

      - name: Commit localized images
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain dist/images/licensed/approved)" ]; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/licensed/approved
          git commit -m "Localize user-selected Commons photos batch A"
          git push origin HEAD:main
