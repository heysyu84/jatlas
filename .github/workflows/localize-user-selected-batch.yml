name: Localize user-selected Commons batch

on:
  push:
    paths:
      - '.github/workflows/localize-user-selected-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and optimize selected Commons photos
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import time
          import requests
          from PIL import Image, ImageOps

          assets = [
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/%E3%81%BF%E3%81%8F%E3%82%8A%E3%81%8C%E6%B1%A001.jpg/960px-%E3%81%BF%E3%81%8F%E3%82%8A%E3%81%8C%E6%B1%A001.jpg",
                  "dist/images/licensed/approved/toyama-murodo-4705.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Uozu_mirage_winter_1.jpg/960px-Uozu_mirage_winter_1.jpg",
                  "dist/images/licensed/approved/toyama-uozu-mirage-4719.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Maruoka_Castle_Keep_Tower%2C_Maruoka-cho_Sakai_2013.jpg/960px-Maruoka_Castle_Keep_Tower%2C_Maruoka-cho_Sakai_2013.jpg",
                  "dist/images/licensed/approved/fukui-maruoka-castle-4907.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Kiyomizu-dera%2C_Kyoto%2C_November_2016_-01.jpg/960px-Kiyomizu-dera%2C_Kyoto%2C_November_2016_-01.jpg",
                  "dist/images/licensed/approved/kyoto-kiyomizudera-6.webp",
              ),
              (
                  "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Namba_Yasaka_jinja_%28Osaka_Naniwa-ku%29_Shrine_hdsr_S5_g06.jpg/960px-Namba_Yasaka_jinja_%28Osaka_Naniwa-ku%29_Shrine_hdsr_S5_g06.jpg",
                  "dist/images/licensed/approved/osaka-namba-yasaka-420.webp",
              ),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Jatlas user-selected photo localizer/1.0",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          })

          for url, dest_name in assets:
              dest = Path(dest_name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              response = None
              for attempt in range(5):
                  response = session.get(url, timeout=60)
                  if response.status_code == 200:
                      break
                  if response.status_code not in (429, 500, 502, 503, 504):
                      response.raise_for_status()
                  time.sleep((5, 10, 20, 40, 60)[attempt])
              if response is None or response.status_code != 200:
                  raise RuntimeError(f"Failed to download {url}: {getattr(response, 'status_code', None)}")
              ctype = (response.headers.get("content-type") or "").lower()
              if "image/" not in ctype:
                  raise RuntimeError(f"Not an image: {url} ({ctype})")
              tmp = dest.with_suffix(".download")
              tmp.write_bytes(response.content)
              with Image.open(tmp) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  if im.width < 600 or im.height < 400:
                      raise RuntimeError(f"Image too small: {url} -> {im.size}")
                  im.thumbnail((1600, 1200), Image.Resampling.LANCZOS)
                  im.save(dest, "WEBP", quality=88, method=6)
              tmp.unlink(missing_ok=True)
              print(dest, dest.stat().st_size)
              time.sleep(1.5)
          PY

      - name: Commit localized images
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain dist/images/licensed/approved)" ]; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/licensed/approved
          git commit -m "Localize user-selected Commons photos batch C"
          git pull --rebase origin main
          git push origin HEAD:main
