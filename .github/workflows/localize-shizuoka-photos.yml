name: Localize selected photos

on:
  push:
    paths:
      - '.github/workflows/localize-shizuoka-photos.yml'\n      - 'tools/official-photo-assets.json'\n      - 'dist/photo-final-overrides.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jatlas-localize-shizuoka
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare selected website photos
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare-official-photos.py

      - name: Verify selected photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'dist/images/licensed/tokyo-ghibli-museum-210.webp': (900, 600),
              'dist/images/licensed/niigata-echigo-yuzawa-4608.webp': (900, 600),
              'dist/images/official/toyama-shomyo-falls-4706.webp': (900, 600),
              'dist/images/licensed/toyama-kurobe-dam-4723.webp': (900, 600),
              'dist/images/official/fukui-obama-port-4919.webp': (900, 600),
              'dist/images/licensed/gifu-gujo-hachiman-castle-906.webp': (900, 600),
              'dist/images/official/mie-iga-ninja-show-3717.webp': (900, 600),
              'dist/images/official/mie-nagashima-overview-3711.webp': (900, 600),
              'dist/images/official/mie-matsusaka-castle-3721.webp': (900, 600),
              'dist/images/official/mie-gojobanyashiki-3722.webp': (900, 600),
              'dist/images/licensed/shizuoka-kanzanji-ropeway-807.webp': (1200, 800),
              'dist/images/licensed/shizuoka-hamamatsu-flower-park-813.webp': (1200, 800),
              'dist/images/licensed/shizuoka-moa-museum-817.webp': (1200, 800),
              'dist/images/licensed/shizuoka-kawazu-shokeidaru-820.webp': (1000, 650),
              'dist/images/official/shizuoka-sunpu-castle-809.webp': (900, 600),
          }
          for filename, (min_w, min_h) in expected.items():
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'Missing generated file: {filename}')
              with Image.open(path) as image:
                  print(filename, image.size)
                  if image.width < min_w or image.height < min_h:
                      raise SystemExit(f'Generated image too small: {filename} {image.size}')
          PY

      - name: Commit selected photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            dist/images/licensed/tokyo-ghibli-museum-210.webp \
            dist/images/licensed/niigata-echigo-yuzawa-4608.webp \
            dist/images/official/toyama-shomyo-falls-4706.webp \
            dist/images/licensed/toyama-kurobe-dam-4723.webp \
            dist/images/official/fukui-obama-port-4919.webp \
            dist/images/licensed/gifu-gujo-hachiman-castle-906.webp \
            dist/images/official/mie-iga-ninja-show-3717.webp \
            dist/images/official/mie-nagashima-overview-3711.webp \
            dist/images/official/mie-matsusaka-castle-3721.webp \
            dist/images/official/mie-gojobanyashiki-3722.webp \
            dist/images/licensed/shizuoka-kanzanji-ropeway-807.webp \
            dist/images/licensed/shizuoka-hamamatsu-flower-park-813.webp \
            dist/images/licensed/shizuoka-moa-museum-817.webp \
            dist/images/licensed/shizuoka-kawazu-shokeidaru-820.webp \
            dist/images/official/shizuoka-sunpu-castle-809.webp
          if git diff --cached --quiet; then
            echo "No selected photo changes to commit."
            exit 0
          fi
          git commit -m "Commit selected representative photos"
          git pull --rebase origin main
          git push
