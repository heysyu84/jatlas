              'dist/images/licensed/hiroshima-castle-2302.webp': (900, 600),
              'dist/images/licensed/yamaguchi-karato-market-2400.webp': (900, 600),
              'dist/images/official/kagawa-yashimaru-2602.webp': (900, 600),
