              'dist/images/licensed/shizuoka-hamamatsu-flower-park-813.webp': (1200, 800),
              'dist/images/licensed/shizuoka-moa-museum-817.webp': (1200, 800),
              'dist/images/licensed/shizuoka-kawazu-shokeidaru-820.webp': (1000, 650),
              'dist/images/official/shizuoka-sunpu-castle-809.webp': (900, 600),
          }
          for filename, (min_w, min_h) in expected.items():
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'Missing generated file: {filename}')
              with Image.open(path) as image:
                  print(filename, image.size)
                  if image.width < min_w or image.height < min_h:
                      raise SystemExit(f'Generated image too small: {filename} {image.size}')
          PY

