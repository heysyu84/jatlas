name: Localize Shizuoka Hello Navi photos

on:
  push:
    paths:
      - '.github/workflows/localize-shizuoka-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jatlas-localize-shizuoka
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare official website photos
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare-official-photos.py

      - name: Switch Shizuoka runtime back to committed local assets
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('dist/shizuoka-expansion.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'https://hellonavi.jp/storage/photos/605/responsive_images/czvHOGV80InjnXTlTqyOMgmXF9CKnLg0nLmoreba__1714_1144.jpg': 'images/official/shizuoka-shiraito-800.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/585/responsive_images/jIhIHDwP8KAVL0v5b26wf8hKiEpv3RKXv0q45Kxj__4900_3675.jpg': 'images/official/shizuoka-sengen-801.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/627/responsive_images/IjMQixkajWFhxdvEX4S4qpcZLyYjF3QqmGR1vEHM__4900_3675.jpg': 'images/official/shizuoka-miho-802.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/802/responsive_images/sGaTUBTGaHQYzzOONawkQrpyndO3IbpNUzB2KPy4__1680_1120.jpg': 'images/official/shizuoka-nihondaira-yume-803.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/498/responsive_images/SALhNuFt4gnzBMlWhQvucvp91dGDxra3h8MlS72A__3059_2060.jpg': 'images/official/shizuoka-hamamatsu-castle-805.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/616/responsive_images/MbXH7iSH9xoqac77kDilgejgZHlq3DPXOGyKuT25__1680_1260.jpg': 'images/official/shizuoka-kakegawa-castle-806.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/489/responsive_images/SjVhsDxIbeWaLVpd4mWa51pfk9hd7uEb6kwWoMjl__1711_1140.jpg': 'images/official/shizuoka-shuzenji-808.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/795/responsive_images/zOGca5CTjbwjZENZYUrRPhqzHWvhgs9GNxVvmLoK__1680_1120.jpg': 'images/official/shizuoka-kunozan-810.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/707/responsive_images/YI7f8vKKZT8JBxLCuVIygNtzAquOABjCNrnVNdkw__1756_1172.jpg': 'images/official/shizuoka-jogasaki-811.webp?v=20261005-local1',
            'https://hellonavi.jp/storage/photos/594/responsive_images/QLot3iC3AHrarInptmbafqolMj55iGzU3ywNXGFn__1680_1260.jpg': 'images/official/shizuoka-nirayama-821.webp?v=20261005-local1',
          }
          count = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  count += 1
          if count != 10:
              raise SystemExit(f'Expected 10 Shizuoka URL replacements, got {count}')
          p.write_text(s, encoding='utf-8')

          index = Path('dist/index.html')
          t = index.read_text(encoding='utf-8')
          old = 'shizuoka-expansion.js?v=20261005-hellonavi-live1'
          new = 'shizuoka-expansion.js?v=20261005-hellonavi-local1'
          if old not in t:
              raise SystemExit('Shizuoka cache token not found')
          index.write_text(t.replace(old, new), encoding='utf-8')
          PY

      - name: Commit ten localized Shizuoka photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/shizuoka-expansion.js dist/index.html
          git add -f \
            dist/images/official/shizuoka-shiraito-800.webp \
            dist/images/official/shizuoka-sengen-801.webp \
            dist/images/official/shizuoka-miho-802.webp \
            dist/images/official/shizuoka-nihondaira-yume-803.webp \
            dist/images/official/shizuoka-hamamatsu-castle-805.webp \
            dist/images/official/shizuoka-kakegawa-castle-806.webp \
            dist/images/official/shizuoka-shuzenji-808.webp \
            dist/images/official/shizuoka-kunozan-810.webp \
            dist/images/official/shizuoka-jogasaki-811.webp \
            dist/images/official/shizuoka-nirayama-821.webp
          git commit -m "Commit ten Shizuoka Hello Navi photos for static deploys"
          git pull --rebase origin main
          git push
