name: Localize selected photos

on:
  push:
    paths:
      - '.github/workflows/localize-shizuoka-photos.yml'
      - 'tools/official-photo-assets.json'
      - 'tools/prepare-official-photos.py'
      - 'dist/kyoto-nara-expansion.js'
      - 'dist/photo-final-overrides.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jatlas-localize-shizuoka
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare selected website photos
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare-official-photos.py

      - name: Verify selected photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'dist/images/licensed/miyazaki-takachiho-gorge-3410.webp': (900, 600),
              'dist/images/licensed/kagoshima-takachiho-gawara-3513.webp': (900, 600),
