name: Localize Shizuoka Hello Navi photos

on:
  push:
    paths:
      - '.github/workflows/localize-shizuoka-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jatlas-localize-shizuoka
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare official website photos
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare-official-photos.py

      - name: Verify Shizuoka batch 3 files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              'dist/images/official/shizuoka-dogashima-tensodo-804.webp',
              'dist/images/official/shizuoka-perry-road-812.webp',
              'dist/images/official/shizuoka-joren-falls-816.webp',
              'dist/images/official/shizuoka-moa-museum-817.webp',
              'dist/images/official/shizuoka-mishima-skywalk-822.webp',
          ]
          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'Missing generated file: {filename}')
              with Image.open(path) as image:
                  print(filename, image.size)
                  if image.width < 900 or image.height < 500:
                      raise SystemExit(f'Generated image too small: {filename} {image.size}')

          with Image.open(files[-1]) as image:
              ratio = image.width / image.height
              if abs(ratio - 1.5) > 0.02:
                  raise SystemExit(f'Skywalk crop ratio is not 3:2: {image.size}')
          PY

      - name: Commit five localized Shizuoka batch 3 photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            dist/images/official/shizuoka-dogashima-tensodo-804.webp \
            dist/images/official/shizuoka-perry-road-812.webp \
            dist/images/official/shizuoka-joren-falls-816.webp \
            dist/images/official/shizuoka-moa-museum-817.webp \
            dist/images/official/shizuoka-mishima-skywalk-822.webp
          if git diff --cached --quiet; then
            echo "No localized photo changes to commit."
            exit 0
          fi
          git commit -m "Commit five Shizuoka Hello Navi batch 3 photos"
          git pull --rebase origin main
          git push
