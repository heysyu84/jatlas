name: Localize Shizuoka selected photos

on:
  push:
    paths:
      - '.github/workflows/localize-shizuoka-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jatlas-localize-shizuoka
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare selected website photos
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare-official-photos.py

      - name: Verify selected Shizuoka photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'dist/images/licensed/shizuoka-moa-museum-817.webp': (1200, 800),
              'dist/images/licensed/shizuoka-kawazu-shokeidaru-820.webp': (1000, 650),
          }
          for filename, (min_w, min_h) in expected.items():
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'Missing generated file: {filename}')
              with Image.open(path) as image:
                  print(filename, image.size)
                  if image.width < min_w or image.height < min_h:
                      raise SystemExit(f'Generated image too small: {filename} {image.size}')
                  ratio = image.width / image.height
                  if not (1.45 <= ratio <= 1.55):
                      raise SystemExit(f'Unexpected aspect ratio: {filename} {image.size}')
          PY

      - name: Commit selected Shizuoka photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            dist/images/licensed/shizuoka-moa-museum-817.webp \
            dist/images/licensed/shizuoka-kawazu-shokeidaru-820.webp
          if git diff --cached --quiet; then
            echo "No selected photo changes to commit."
            exit 0
          fi
          git commit -m "Commit selected MOA and Kawazu photos"
          git pull --rebase origin main
          git push
