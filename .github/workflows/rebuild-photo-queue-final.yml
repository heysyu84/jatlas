name: Rebuild final photo QA queue

on:
  push:
    paths:
      - '.github/workflows/rebuild-photo-queue-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild runtime photo queue
        run: |
          node tools/audit-content.cjs /tmp/jatlas-runtime.json
          python tools/build-photo-queue.py /tmp/jatlas-runtime.json
          node tools/test-national-canonical-completion.cjs
          node tools/test-map-photo.cjs

      - name: Verify resolved queue
        run: |
          node <<'NODE'
          const q=require('./audits/photo-queue.json');
          console.log(JSON.stringify(q.summary,null,2));
          if(q.summary.remainingCandidates!==0) {
            console.error('Unresolved photo candidates:', q.items.filter(x=>x.status==='needs-review'));
            process.exit(1);
          }
          if(q.summary.missingPhotos!==0) process.exit(1);
          NODE

      - name: Commit refreshed QA queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/photo-queue.json
          if git diff --cached --quiet; then
            echo "Queue already current"
            exit 0
          fi
          git commit -m "Resolve final current photo QA queue"
          git restore .
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
