name: Migrate Greater Tokyo canonical photos

on:
  push:
    branches: [main]
    paths:
      - tools/migrate-greater-tokyo-canonical.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: jatlas-greater-tokyo-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install Pillow==11.3.0 pykakasi==2.3.0
          npm install --prefix /tmp/jatlas-jsdom jsdom@26.1.0
      - name: Wait for triggering commit to become the deployment baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(git rev-parse HEAD)"
          echo "$BASE" > /tmp/greater-tokyo-base-sha
          for i in $(seq 1 90); do
            RESULT="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=40" | jq -r --arg sha "$BASE" '[.workflow_runs[] | select(.name=="Deploy Jatlas to GitHub Pages" and .head_sha==$sha)][0] | if . == null then "pending" else (.conclusion // .status // "pending") end')"
            echo "Pages baseline $BASE: $RESULT"
            if [ "$RESULT" = "success" ]; then exit 0; fi
            if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Capture pre-migration runtime
        run: node tools/audit-content.cjs /tmp/greater-tokyo-before.json
      - name: Migrate and recover Greater Tokyo photos
        run: python tools/migrate-greater-tokyo-canonical.py
      - name: Capture post-migration runtime
        run: node tools/audit-content.cjs /tmp/greater-tokyo-after.json
      - name: Declare exact runtime changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/greater-tokyo-before.json').read_text())
          after=json.loads(Path('/tmp/greater-tokyo-after.json').read_text())
          base=Path('/tmp/greater-tokyo-base-sha').read_text().strip()
          prefs={'사이타마','지바','도쿄','가나가와'}
          bm={int(x['id']):x for x in before['places'] if x.get('pref') in prefs}
          am={int(x['id']):x for x in after['places'] if x.get('pref') in prefs}
          photo=[]
          for ident in sorted(set(bm)&set(am)):
              a=(bm[ident].get('photo') or {}).get('src',''); b=(am[ident].get('photo') or {}).get('src','')
              if a!=b: photo.append({'id':ident,'fromSrc':a,'toSrc':b})
          hero=[]
          for key in sorted(set(before.get('heroes',{}))|set(after.get('heroes',{}))):
              a=(before.get('heroes',{}).get(key) or {}).get('src',''); b=(after.get('heroes',{}).get(key) or {}).get('src','')
              if a!=b: hero.append({'key':key,'fromSrc':a,'toSrc':b})
          Path('tools/content-change-intent.json').write_text(json.dumps({
            'version':1,'baseCommit':base,
            'reason':'Migrate Greater Tokyo to canonical IDs/paths and recover approved missing assets without changing place content.',
            'allow':{'placeAdds':[],'placeRemovals':[],'placeEdits':[],'photoChanges':photo,'heroChanges':hero,'canonicalPhotoChanges':[]}
          },ensure_ascii=False,indent=2)+'\n')
          print('Declared photoChanges=',len(photo),'heroChanges=',len(hero))
          PY
      - name: Validate generated runtime
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          t=Path('dist/photo-registry-data.js').read_text(); p='globalThis.JATLAS_PHOTO_REGISTRY_DATA='
          r=json.loads(t[len(p):].rstrip().rstrip(';')); prefs={'사이타마','지바','도쿄','가나가와'}
          ps=[x for x in r['places'].values() if x['pref'] in prefs]; fs=[x for x in r['foods'].values() if x['pref'] in prefs]
          print('Generated registry counts:',len(ps),len(fs))
          from collections import Counter
          print('Place prefs:',Counter(x['pref'] for x in ps)); print('Food prefs:',Counter(x['pref'] for x in fs))
          assert len(ps)==132,('places',len(ps)); assert len(fs)==39,('foods',len(fs))
          for x in ps+fs:
              f=Path('dist')/x['image']; assert f.is_file(),x['image']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==x['sha256'],x['canonicalId']
              assert re.fullmatch(r'(11|12|13|14)-[PF]\d{4}',x['canonicalId']),x['canonicalId']
          print('Greater Tokyo canonical files verified:',len(ps)+len(fs))
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/regions/greater-tokyo dist/images/licensed dist/photo-registry-data.js dist/index.html README.md audits/greater-tokyo-migration-completion.json tools/content-change-intent.json
          git add -f dist/images/official/tokyo-oshima-milk-soft.webp
          if git diff --cached --quiet; then echo "No migration changes"; exit 0; fi
          git commit -m "Migrate Greater Tokyo photos to canonical structure"
      - name: Run regression guard on migration commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/regression-guard.cjs
      - name: Push migration
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
