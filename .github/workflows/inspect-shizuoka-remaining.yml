name: Inspect Shizuoka remaining photo ids

on:
  push:
    paths:
      - '.github/workflows/inspect-shizuoka-remaining.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            function fetchText(url) {
              return new Promise((resolve, reject) => {
                https.get(url,{headers:{'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}},res=>{
                  let data=''; res.setEncoding('utf8');
                  res.on('data',d=>data+=d);
                  res.on('end',()=>resolve(data));
                }).on('error',reject);
              });
            }
            const strip=s=>String(s||'').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#039;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();

            for(const id of ['608']){
              const html=await fetchText('https://hellonavi.jp/photo/'+id);
              const text=strip(html);
              const img=[...html.matchAll(/(?:src|data-src|data-original)=["']([^"']*\/storage\/photos\/[^"']+)["']/g)].map(m=>new URL(m[1],'https://hellonavi.jp').href);
              console.log('DETAIL608',JSON.stringify({id,text:text.slice(0,1200),imgs:[...new Set(img)].slice(0,5)}));
            }

            for(const q of ['駿府城公園','浜松フラワーパーク','かんざんじロープウェイ','浜名湖パルパル ロープウェイ','御殿場プレミアム・アウトレット']){
              const html=await fetchText('https://hellonavi.jp/photo?q='+encodeURIComponent(q));
              const ids=[...new Set([...html.matchAll(/href=["'][^"']*\/photo\/(\d+)["']/g)].map(m=>m[1]))];
              const titles=[...html.matchAll(/<h3[^>]*>([\s\S]*?)<\/h3>/g)].map(m=>strip(m[1])).filter(x=>x&&!['観光案内','当サイトについて','Language'].includes(x));
              console.log('QUERY',JSON.stringify({q,ids,titles}));
            }
