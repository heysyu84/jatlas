name: Inspect user-selected place IDs

on:
  push:
    paths:
      - '.github/workflows/inspect-user-selected-place-ids.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve place IDs from runtime
        run: |
          node tools/audit-content.cjs /tmp/runtime.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/runtime.json',encoding='utf-8'))
          needles=[
            '아키요시도','히메지성','오사카 주거박물관','사키쓰','마루가메성',
            '하라지리','히라도성','우스키 마애불','세키노오','평화기념','마키시 공설시장'
          ]
          for p in data.get('places',[]):
              name=str(p.get('name',''))
              if any(n in name for n in needles):
                  print('PLACE_ID',p.get('id'),p.get('pref'),name)
          PY
