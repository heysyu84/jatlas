name: Inspect user-selected place IDs

on:
  push:
    paths:
      - '.github/workflows/inspect-user-selected-place-ids.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Mie runtime photos
        run: |
          node tools/audit-content.cjs /tmp/runtime.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/runtime.json',encoding='utf-8'))
          for p in data.get('places',[]):
              name=str(p.get('name',''))
              if any(s in name for s in ['닌자','나가시마','마고세','馬越','ナガシマ','忍者']):
                  print('RUNTIME_PHOTO',p.get('id'),p.get('pref'),name,json.dumps(p.get('photo'),ensure_ascii=False))
          for k,v in (data.get('heroes') or {}).items():
              if any(s in str(k) for s in ['이가','북세','히가시']) or any(s in json.dumps(v,ensure_ascii=False) for s in ['mie-iga','mie-nagashima','mie-magose','닌자','나가시마','마고세']):
                  print('RUNTIME_HERO',k,json.dumps(v,ensure_ascii=False))
          PY
