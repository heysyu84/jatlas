name: Inspect user-selected place IDs

on:
  push:
    paths:
      - '.github/workflows/inspect-user-selected-place-ids.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Mie runtime photos
        run: |
          node tools/audit-content.cjs /tmp/runtime.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/runtime.json',encoding='utf-8'))
          ids={3711,3717,3726}
          for p in data.get('places',[]):
              if int(p.get('id',-1)) in ids:
                  print('RUNTIME_PHOTO',p.get('id'),p.get('name'),json.dumps(p.get('photo'),ensure_ascii=False))
          for k,v in (data.get('heroes') or {}).items():
              s=json.dumps(v,ensure_ascii=False)
              if any(x in s for x in ['3711','3717','3726','mie-iga','mie-nagashima','mie-magose']):
                  print('RUNTIME_HERO',k,s)
          PY
