name: Realign Hokkaido-Tohoku food canonical IDs
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-early-food-canonical-ids.py'
      - '.github/workflows/fix-early-food-canonical-ids.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jatlas-early-food-id-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Realign food IDs without re-encoding images
        run: python tools/fix-early-food-canonical-ids.py
      - name: Verify canonical files exist and paths are ASCII
        run: node tools/test-canonical-photo-paths.cjs
      - name: Commit corrected IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/images/regions/hokkaido/hokkaido/foods dist/images/regions/tohoku dist/photo-registry-data.js audits/food-id-realignment.json
          if git diff --cached --quiet; then echo "No food ID changes"; exit 0; fi
          git commit -m "Realign Hokkaido and Tohoku food canonical IDs"
          git pull --rebase origin main
          git push origin HEAD:main
