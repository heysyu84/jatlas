name: Freeze Jatlas structure baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/build-structure-baseline.cjs
      - .github/workflows/freeze-structure-baseline.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: structure-baseline
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current runtime against deployment guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/regression-guard.cjs

      - name: Build migration baseline
        run: node tools/build-structure-baseline.cjs

      - name: Commit generated baseline
        run: |
          if git diff --quiet -- audits/structure-migration-baseline.json audits/id-migration-map.json audits/image-reference-audit.json; then
            echo "Baseline is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/structure-migration-baseline.json audits/id-migration-map.json audits/image-reference-audit.json
          git commit -m "chore: freeze structure migration baseline [skip ci]"
          git push origin HEAD:main
