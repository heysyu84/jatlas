name: Refresh current QA photos

on:
  push:
    paths:
      - '.github/workflows/refresh-current-qa-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download reviewed Commons replacements
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import hashlib, html, io, json, re, time
          import requests
          from PIL import Image, ImageOps

          root = Path('.')
          dist = root / 'dist'
          targets = {
            # Places
            '46-P0012': ('places', 'images/regions/kyushu/kagoshima/places/46-P0012-kiri-shima-jingu.webp', 'Kirishima-Jingu Shrine (52018760308).jpg'),
            '21-P0005': ('places', 'images/regions/tokai/gifu/places/21-P0005-hida-folk-village.webp', 'Hida no Sato (6088104463).jpg'),
            '20-P0012': ('places', 'images/regions/koshinetsu/nagano/places/20-P0012-shiraito-falls.webp', 'Karuizawa shiraito-no-taki02s3872.jpg'),
            '20-P0016': ('places', 'images/regions/koshinetsu/nagano/places/20-P0016-lake-suwa.webp', 'Lake Suwa in August 2026.jpg'),
            '42-P0003': ('places', 'images/regions/kyushu/nagasaki/places/42-P0003-dejima.webp', 'Dejima Nagasaki Japan33n.jpg'),
            '42-P0023': ('places', 'images/regions/kyushu/nagasaki/places/42-P0023-ose-saki-todai.webp', 'Ohsezaki1404.jpg'),
            '23-P0013': ('places', 'images/regions/tokai/aichi/places/23-P0013-osu-shopping-street.webp', 'Osu Kannon Street 2021-07 ac (3).jpg'),
            '06-P0011': ('places', 'images/regions/tohoku/yamagata/places/06-P0011-uesugi-family-mausoleum.webp', 'Approachway to the mausoleums of Uesugi Family.jpg'),
            '38-P0010': ('places', 'images/regions/shikoku/ehime/places/38-P0010-shimonada-eki.webp', '下灘駅と瀬戸内海.jpg'),
            '27-P0016': ('places', 'images/regions/kinki/osaka/places/27-P0016-katsuo-tera.webp', '勝尾寺山門.jpg'),
            '44-P0005': ('places', 'images/regions/kyushu/oita/places/44-P0005-take-kawara-onsen.webp', 'Takegawara Onsen 20170218.jpg'),

            # Foods
            '37-F0004': ('foods', 'images/regions/shikoku/kagawa/foods/37-F0004-olive-beef.webp', 'Griddled wagyu beef.jpg'),
            '37-F0005': ('foods', 'images/regions/shikoku/kagawa/foods/37-F0005-wasanbon.webp', '和菓子1261441.jpg'),
            '46-F0002': ('foods', 'images/regions/kyushu/kagoshima/foods/46-F0002-kagoshima-kurobuta.webp', 'Kagoshima Kurobuta no Tonkotsu.jpg'),
            '39-F0006': ('foods', 'images/regions/shikoku/kochi/foods/39-F0006-shimanto-unagi.webp', 'Eel bowl, bowl of eel and rice; 2013.jpg'),
            '43-F0002': ('foods', 'images/regions/kyushu/kumamoto/foods/43-F0002-kumamoto-ramen.webp', 'Kumamoto ramen 001.jpg'),
            '13-F0017': ('foods', 'images/regions/greater-tokyo/tokyo/foods/13-F0017-oshima-milk-ashitaba-snack.webp', '築地ペッパーズカフェIMG 20220312 02.jpg'),
            '31-F0002': ('foods', 'images/regions/sanin-sanyo/tottori/foods/31-F0002-tottori-wagyu.webp', 'Wagyu Beef (173957803).jpeg'),
            '04-F0004': ('foods', 'images/regions/tohoku/miyagi/foods/04-F0004-sasakamaboko.webp', 'Sasa-Kamaboko 001.jpg'),
            '32-F0003': ('foods', 'images/regions/sanin-sanyo/shimane/foods/32-F0003-shimane-wagyu.webp', 'Raw-shimanewagyu-20200210.jpg'),
            '22-F0005': ('foods', 'images/regions/tokai/shizuoka/foods/22-F0005-hamanako-unagi.webp', 'Unagi Hamamatsu.JPG'),
            '22-F0006': ('foods', 'images/regions/tokai/shizuoka/foods/22-F0006-hamana-lake-unagi.webp', 'Grilled eel topped on rice (8174690852).jpg'),
            '27-F0003': ('foods', 'images/regions/kinki/osaka/foods/27-F0003-doteyaki.webp', 'Doteyaki - 2025 Jan 1 various.jpeg'),
            '27-F0006': ('foods', 'images/regions/kinki/osaka/foods/27-F0006-ikayaki.webp', '阪神百貨店のいか焼きIMG 20211230 113552.jpg'),
            '44-F0004': ('foods', 'images/regions/kyushu/oita/foods/44-F0004-bungo-beef.webp', 'Wagyu Beef for Shabu-shabu.jpg'),
            '08-F0002': ('foods', 'images/regions/north-kanto/ibaraki/foods/08-F0002-anko-nabe.webp', 'Nabe of angler fish after.jpg'),
            '17-F0001': ('foods', 'images/regions/hokuriku/ishikawa/foods/17-F0001-kanazawa-oden.webp', '金沢おでん勝一20241030 04.jpg'),
            '18-F0001': ('foods', 'images/regions/hokuriku/fukui/foods/18-F0001-mizu-yokan.webp', '福井市和菓子司えがわの水羊かん Jan 8, 2024.jpg'),
          }

          registry_path = dist / 'photo-registry-data.js'
          raw = registry_path.read_text()
          prefix = 'globalThis.JATLAS_PHOTO_REGISTRY_DATA='
          if not raw.startswith(prefix):
              raise RuntimeError('Unexpected registry wrapper')
          registry = json.loads(raw[len(prefix):].strip().rstrip(';'))

          session = requests.Session()
          session.headers.update({'User-Agent':'Jatlas/1.0 (travel photo attribution maintenance)'})

          def plain(meta, key):
              value = meta.get(key, {}).get('value', '')
              return html.unescape(re.sub(r'<[^>]+>', '', value)).strip()

          def lookup(filename):
              response = session.get('https://commons.wikimedia.org/w/api.php', params={
                  'action':'query','format':'json','formatversion':'2',
                  'titles':'File:'+filename,
                  'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'1800',
                  'redirects':'1',
              }, timeout=60)
              response.raise_for_status()
              pages = response.json().get('query', {}).get('pages', [])
              if not pages or pages[0].get('missing') or not pages[0].get('imageinfo'):
                  raise RuntimeError(f'Commons file missing: {filename}')
              return pages[0]['imageinfo'][0]

          changed = []
          for index, (canonical_id, (kind, relpath, filename)) in enumerate(targets.items(), 1):
              info = lookup(filename)
              meta = info.get('extmetadata', {})
              license_name = plain(meta, 'LicenseShortName')
              license_url = plain(meta, 'LicenseUrl')
              if not license_name:
                  raise RuntimeError(f'No reusable license metadata: {filename}')
              url = info.get('thumburl') or info.get('url')
              resp = session.get(url, timeout=90)
              resp.raise_for_status()
              im = ImageOps.exif_transpose(Image.open(io.BytesIO(resp.content))).convert('RGB')
              if max(im.size) < 800:
                  raise RuntimeError(f'Replacement too small: {filename} {im.size}')
              im.thumbnail((1800, 1350), Image.Resampling.LANCZOS)
              dest = dist / relpath
              dest.parent.mkdir(parents=True, exist_ok=True)
              tmp = dest.with_suffix('.tmp')
              im.save(tmp, 'WEBP', quality=88, method=6)
              tmp.replace(dest)

              record = registry[kind].get(canonical_id)
              if not record:
                  raise RuntimeError(f'Missing canonical record {kind}:{canonical_id}')
              record['source'] = info.get('descriptionurl') or f'https://commons.wikimedia.org/wiki/File:{filename.replace(" ", "_")}'
              record['terms'] = license_url or record['source']
              record['author'] = plain(meta, 'Artist')
              record['sha256'] = hashlib.sha256(dest.read_bytes()).hexdigest()
              record['revision'] = int(record.get('revision') or 1) + 1
              record['image'] = relpath
              changed.append((canonical_id, filename, im.size, record['revision']))
              print(f'{index}/{len(targets)} {canonical_id} <- {filename} {im.size}', flush=True)
              time.sleep(0.15)

          # Correct a discovered Gifu canonical-ID typo without changing the image.
          gifu = registry['foods'].get('21-F0002')
          if gifu is None:
              # older registry accidentally keyed this one as 20-F0002
              old = registry['foods'].pop('20-F0002', None)
              if old and old.get('pref') == '기후' and old.get('name') == '고헤이모치':
                  old['canonicalId'] = '21-F0002'
                  registry['foods']['21-F0002'] = old
                  print('Corrected Gifu gohei-mochi canonical ID 20-F0002 -> 21-F0002')
          elif gifu.get('canonicalId') != '21-F0002':
              gifu['canonicalId'] = '21-F0002'

          registry_path.write_text(prefix + json.dumps(registry, ensure_ascii=False, indent=2) + ';\n')
          Path('/tmp/refreshed.json').write_text(json.dumps(changed, ensure_ascii=False, indent=2))
          PY

      - name: Commit refreshed canonical photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/photo-registry-data.js dist/images/regions
          if git diff --cached --quiet; then
            echo "No photo changes"
            exit 0
          fi
          git commit -m "Refresh remaining reviewed QA photos"
          git pull --rebase origin main
          git push origin HEAD:main
