name: Refresh current QA photos

on:
  push:
    paths:
      - '.github/workflows/refresh-current-qa-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download reviewed Commons replacements
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import hashlib, html, io, json, re, time
          import requests
          from PIL import Image, ImageOps

          root = Path('.')
          dist = root / 'dist'
          targets = {
            '22-F0005': ('foods', 'images/regions/tokai/shizuoka/foods/22-F0005-hamanako-unagi.webp', '日式蒲燒鰻魚飯 (DSC04153).jpg'),
            '17-F0001': ('foods', 'images/regions/hokuriku/ishikawa/foods/17-F0001-kanazawa-oden.webp', 'Mitsui Garden Hotel Kanazawa 1F Noukabanzai Mantei breakfast buffet 20200104-001.jpg'),
          }

          registry_path = dist / 'photo-registry-data.js'
          raw = registry_path.read_text()
          prefix = 'globalThis.JATLAS_PHOTO_REGISTRY_DATA='
          if not raw.startswith(prefix):
              raise RuntimeError('Unexpected registry wrapper')
          registry = json.loads(raw[len(prefix):].strip().rstrip(';'))

          session = requests.Session()
          session.headers.update({'User-Agent':'Jatlas/1.0 (travel photo attribution maintenance)'})

          def plain(meta, key):
              value = meta.get(key, {}).get('value', '')
              return html.unescape(re.sub(r'<[^>]+>', '', value)).strip()

          titles = [v[2] for v in targets.values()]
          response = session.get('https://commons.wikimedia.org/w/api.php', params={
              'action':'query','format':'json','formatversion':'2',
              'titles':'|'.join('File:'+name for name in titles),
              'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'1800',
              'redirects':'1',
          }, timeout=90)
          response.raise_for_status()
          pages = response.json().get('query', {}).get('pages', [])
          metadata = {}
          for page in pages:
              title = str(page.get('title',''))
              if title.startswith('File:') and page.get('imageinfo'):
                  metadata[title[5:]] = page['imageinfo'][0]
          if len(metadata) != len(set(titles)):
              missing = sorted(set(titles) - set(metadata))
              raise RuntimeError(f'Commons metadata missing: {missing}')

          def download(url, filename):
              last = None
              for attempt, wait in enumerate((0, 4, 8, 16, 30, 45)):
                  if wait:
                      time.sleep(wait)
                  resp = session.get(url, timeout=90)
                  last = resp
                  if resp.status_code == 200:
                      return resp.content
                  if resp.status_code not in (429, 500, 502, 503, 504):
                      resp.raise_for_status()
              raise RuntimeError(f'Download failed after retries: {filename} status={getattr(last, "status_code", None)}')

          changed = []
          for index, (canonical_id, (kind, relpath, filename)) in enumerate(targets.items(), 1):
              info = metadata[filename]
              meta = info.get('extmetadata', {})
              license_name = plain(meta, 'LicenseShortName')
              license_url = plain(meta, 'LicenseUrl')
              if not license_name:
                  raise RuntimeError(f'No reusable license metadata: {filename}')
              url = info.get('thumburl') or info.get('url')
              payload = download(url, filename)
              im = ImageOps.exif_transpose(Image.open(io.BytesIO(payload))).convert('RGB')
              if max(im.size) < 800:
                  raise RuntimeError(f'Replacement too small: {filename} {im.size}')
              im.thumbnail((1800, 1350), Image.Resampling.LANCZOS)
              dest = dist / relpath
              dest.parent.mkdir(parents=True, exist_ok=True)
              tmp = dest.with_suffix('.tmp')
              im.save(tmp, 'WEBP', quality=88, method=6)
              tmp.replace(dest)

              record = registry[kind].get(canonical_id)
              if not record:
                  raise RuntimeError(f'Missing canonical record {kind}:{canonical_id}')
              record['source'] = info.get('descriptionurl') or f'https://commons.wikimedia.org/wiki/File:{filename.replace(" ", "_")}'
              record['terms'] = license_url or record['source']
              record['author'] = plain(meta, 'Artist')
              record['sha256'] = hashlib.sha256(dest.read_bytes()).hexdigest()
              record['revision'] = int(record.get('revision') or 1) + 1
              record['image'] = relpath
              changed.append((canonical_id, filename, im.size, record['revision']))
              print(f'{index}/{len(targets)} {canonical_id} <- {filename} {im.size}', flush=True)
              time.sleep(0.7)

          # Correct a discovered Gifu canonical-ID typo without changing the image.
          gifu = registry['foods'].get('21-F0002')
          if gifu is None:
              # older registry accidentally keyed this one as 20-F0002
              old = registry['foods'].pop('20-F0002', None)
              if old and old.get('pref') == '기후' and old.get('name') == '고헤이모치':
                  old['canonicalId'] = '21-F0002'
                  registry['foods']['21-F0002'] = old
                  print('Corrected Gifu gohei-mochi canonical ID 20-F0002 -> 21-F0002')
          elif gifu.get('canonicalId') != '21-F0002':
              gifu['canonicalId'] = '21-F0002'

          registry_path.write_text(prefix + json.dumps(registry, ensure_ascii=False, indent=2) + ';\n')
          Path('/tmp/refreshed.json').write_text(json.dumps(changed, ensure_ascii=False, indent=2))
          PY

      - name: Commit refreshed canonical photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/photo-registry-data.js dist/images/regions
          if git diff --cached --quiet; then
            echo "No photo changes"
            exit 0
          fi
          git commit -m "Refresh remaining reviewed QA photos"
          git pull --rebase origin main
          git push origin HEAD:main
