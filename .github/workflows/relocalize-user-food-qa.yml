name: Relocalize user food QA targets

on:
  push:
    paths:
      - '.github/workflows/relocalize-user-food-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relocalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-download canonical source images
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import hashlib, html, io, json, re, time, urllib.parse
          import requests
          from PIL import Image, ImageOps

          ids = [
            '03-F0006','01-F0009','04-F0003','05-F0002','05-F0003','05-F0008',
            '07-F0008','07-F0003','11-F0001','14-F0006','19-F0004','19-F0001',
            '20-F0005','15-F0005','15-F0004','24-F0005','24-F0006','17-F0004',
            '26-F0003','26-F0006','26-F0005','27-F0006','28-F0006','28-F0005',
            '29-F0004','31-F0003','32-F0005','35-F0006','42-F0006'
          ]

          reg_path=Path('dist/photo-registry-data.js')
          raw=reg_path.read_text()
          prefix='globalThis.JATLAS_PHOTO_REGISTRY_DATA='
          reg=json.loads(raw[len(prefix):].strip().rstrip(';'))
          foods=reg['foods']
          session=requests.Session()
          session.headers.update({'User-Agent':'Jatlas/1.0 food photo QA relocalization'})

          def filename_from_source(url):
              if 'commons.wikimedia.org/wiki/File:' not in url:
                  return None
              part=url.split('/wiki/File:',1)[1]
              return urllib.parse.unquote(part).replace('_',' ')

          targets=[]
          for cid in ids:
              rec=foods.get(cid)
              if not rec:
                  raise RuntimeError(f'missing registry record {cid}')
              fn=filename_from_source(rec.get('source',''))
              if not fn:
                  raise RuntimeError(f'non-Commons source for {cid}: {rec.get("source")}')
              targets.append((cid,rec,fn))

          def metadata_for(names):
              out={}
              for start in range(0,len(names),20):
                  batch=names[start:start+20]
                  for attempt in range(6):
                      r=session.get('https://commons.wikimedia.org/w/api.php',params={
                        'action':'query','format':'json','formatversion':'2',
                        'titles':'|'.join('File:'+x for x in batch),
                        'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'1800',
                        'redirects':'1'
                      },timeout=90)
                      if r.status_code==200: break
                      if r.status_code!=429: r.raise_for_status()
                      time.sleep(4*(attempt+1))
                  r.raise_for_status()
                  for page in r.json().get('query',{}).get('pages',[]):
                      if page.get('imageinfo'):
                          title=page.get('title','')
                          if title.startswith('File:'):
                              out[title[5:]]=page['imageinfo'][0]
                  time.sleep(1)
              return out

          meta=metadata_for([x[2] for x in targets])

          def dl(url):
              last=None
              for wait in (0,3,6,12,24,40):
                  if wait: time.sleep(wait)
                  r=session.get(url,timeout=90)
                  last=r
                  if r.status_code==200: return r.content
                  if r.status_code not in (429,500,502,503,504): r.raise_for_status()
              raise RuntimeError(f'download failed: {getattr(last,"status_code",None)} {url}')

          changed=[]
          for i,(cid,rec,fn) in enumerate(targets,1):
              info=meta.get(fn)
              if not info:
                  # redirected title can differ: query exact one separately
                  q=session.get('https://commons.wikimedia.org/w/api.php',params={
                    'action':'query','format':'json','formatversion':'2','titles':'File:'+fn,
                    'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'1800','redirects':'1'
                  },timeout=90); q.raise_for_status()
                  page=q.json()['query']['pages'][0]
                  info=page['imageinfo'][0]
              payload=dl(info.get('thumburl') or info['url'])
              im=ImageOps.exif_transpose(Image.open(io.BytesIO(payload))).convert('RGB')
              im.thumbnail((1800,1350),Image.Resampling.LANCZOS)
              dest=Path('dist')/rec['image']
              tmp=dest.with_suffix('.tmp')
              im.save(tmp,'WEBP',quality=88,method=6)
              tmp.replace(dest)
              rec['sha256']=hashlib.sha256(dest.read_bytes()).hexdigest()
              rec['revision']=int(rec.get('revision') or 1)+1
              changed.append((cid,rec['name'],fn,im.size))
              print(f'{i}/{len(targets)} {cid} {rec["name"]} <- {fn} {im.size}',flush=True)
              time.sleep(.8)

          reg_path.write_text(prefix+json.dumps(reg,ensure_ascii=False,indent=2)+';\n')
          print(json.dumps(changed,ensure_ascii=False,indent=2))
          PY

      - name: Commit relocalized food photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/photo-registry-data.js dist/images/regions
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Relocalize user-reported food photos"
          git restore .
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
