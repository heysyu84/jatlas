name: Deploy Jatlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for licensed website assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare licensed website photos
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare-official-photos.py

      - name: Audit duplicate tourist spots
        run: node tools/audit-duplicates.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Wait for Pages artifact indexing
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
