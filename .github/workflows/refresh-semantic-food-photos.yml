name: Refresh semantic food photos

on:
  push:
    paths:
      - '.github/workflows/refresh-semantic-food-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace semantically poor food photos
        run: |
          python -m pip install requests Pillow
          python - <<'PY'
          from pathlib import Path
          import hashlib, html, io, json, re, time
          import requests
          from PIL import Image, ImageOps

          dist = Path('dist')
          targets = {
            '01-F0009': ('foods','images/regions/hokkaido/hokkaido/foods/01-F0009-jingisukan.webp','Jingisukan (46537378761).jpg'),
            '03-F0006': ('foods','images/regions/tohoku/iwate/foods/03-F0006-sanriku-scallop.webp','Grilled scallop (5041395406).jpg'),
            '04-F0003': ('foods','images/regions/tohoku/miyagi/foods/04-F0003-matsushima-oysters.webp','Grilled oysters (14717836398).jpg'),
            '05-F0002': ('foods','images/regions/tohoku/akita/foods/05-F0002-babahera-ice.webp','ババさんアイス（児玉冷菓）.jpg'),
            '05-F0003': ('foods','images/regions/tohoku/akita/foods/05-F0003-akita-beef.webp','Dishes foresta Chokai (10).jpg'),
            '05-F0008': ('foods','images/regions/tohoku/akita/foods/05-F0008-hatahata.webp','Fried hatahata.jpg'),
            '07-F0008': ('foods','images/regions/tohoku/fukushima/foods/07-F0008-fukushima-peaches.webp','Shinkansen logistics system fair by Fukushima peach.jpg'),
            '07-F0003': ('foods','images/regions/tohoku/fukushima/foods/07-F0003-mamador.webp','Mamadoru (2).jpg'),
            '11-F0001': ('foods','images/regions/greater-tokyo/saitama/foods/11-F0001-buta-miso-don.webp','Buta-don 001.jpg'),
            '14-F0006': ('foods','images/regions/greater-tokyo/kanagawa/foods/14-F0006-yokohama-ie-kei-ramen.webp','山崎ラーメン 横浜家系ラーメン 山崎家 2026年1月25日の横浜 202601251535 IMG 4752.jpg'),
            '19-F0004': ('foods','images/regions/koshinetsu/yamanashi/foods/19-F0004-shingen-mochi.webp','Kikyou-shingenmochi 001.jpg'),
            '19-F0001': ('foods','images/regions/koshinetsu/yamanashi/foods/19-F0001-koshu-wine.webp','Chanmoris Wine ac (2).jpg'),
            '20-F0005': ('foods','images/regions/koshinetsu/nagano/foods/20-F0005-shinshu-apples.webp','Red apples in a silver bowl.jpg'),
            '15-F0005': ('foods','images/regions/koshinetsu/niigata/foods/15-F0005-murakami-salmon.webp','Salmon Saikyo-Yaki.jpg'),
            '15-F0004': ('foods','images/regions/koshinetsu/niigata/foods/15-F0004-tochio-aburaage.webp','Tochio-aburage.jpg'),
            '24-F0005': ('foods','images/regions/tokai/mie/foods/24-F0005-ise-udon.webp','Ise Udon by Kinoko.JPG'),
            '24-F0006': ('foods','images/regions/tokai/mie/foods/24-F0006-ise-ebi.webp','Sashimi 伊勢エビ.jpg'),
            '17-F0004': ('foods','images/regions/hokuriku/ishikawa/foods/17-F0004-gold-leaf-soft-serve.webp','Gold leaf on soft ice cream - Kanazawa, Japan - DSC00135.jpg'),
            '26-F0003': ('foods','images/regions/kinki/kyoto/foods/26-F0003-yatsuhashi.webp','Yatsuhashi nama.jpg'),
            '26-F0006': ('foods','images/regions/kinki/kyoto/foods/26-F0006-yudofu.webp','Yudofu meal set in Kyoto.jpg'),
            '26-F0005': ('foods','images/regions/kinki/kyoto/foods/26-F0005-uji-matcha-dessert.webp','JP 日本 Japan 京都 Kyoto 宇治城 Uji-shi Uji Myouraku shop Nakamura Tokichi Honten Tea House cafe 綠茶甜品 Matcha cream June 2026 N13P 08.jpg'),
            '27-F0006': ('foods','images/regions/kinki/osaka/foods/27-F0006-ikayaki.webp','Ikayaki (7629347178).jpg'),
            '28-F0006': ('foods','images/regions/kinki/hyogo/foods/28-F0006-himeji-oden.webp','Himeji Oden.jpg'),
            '28-F0005': ('foods','images/regions/kinki/hyogo/foods/28-F0005-izushi-sara-soba.webp','Izushi Soba.JPG'),
            '29-F0004': ('foods','images/regions/kinki/nara/foods/29-F0004-miwa-somen.webp','Miwa somen 01.jpg'),
            '31-F0003': ('foods','images/regions/sanin-sanyo/tottori/foods/31-F0003-tofu-chikuwa.webp','Tofutikuwa1.jpg'),
            '32-F0005': ('foods','images/regions/sanin-sanyo/shimane/foods/32-F0005-izumo-soba.webp','IzumoSoba WarigoSoba 5dan.jpg'),
            '35-F0006': ('foods','images/regions/sanin-sanyo/yamaguchi/foods/35-F0006-hagi-natsumikan-sweets.webp','NatsuKanTou Oimatsu.jpg'),
            '42-F0006': ('foods','images/regions/kyushu/nagasaki/foods/42-F0006-sasebo-burger.webp','The Sasebo burger made at The Logkit.JPG'),
          }

          registry_path = dist/'photo-registry-data.js'
          raw = registry_path.read_text()
          prefix = 'globalThis.JATLAS_PHOTO_REGISTRY_DATA='
          registry = json.loads(raw[len(prefix):].strip().rstrip(';'))

          session=requests.Session()
          session.headers.update({'User-Agent':'Jatlas/1.0 (food photo semantic QA)'})

          def plain(meta,key):
              return html.unescape(re.sub(r'<[^>]+>','',meta.get(key,{}).get('value',''))).strip()

          def api_chunk(names):
              requested=['File:'+n for n in names]
              response=session.get('https://commons.wikimedia.org/w/api.php',params={
                  'action':'query','format':'json','formatversion':'2',
                  'titles':'|'.join(requested),
                  'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'1800',
                  'redirects':'1',
              },timeout=90)
              response.raise_for_status()
              payload=response.json().get('query',{})
              aliases={}
              for row in payload.get('normalized',[]): aliases[row['from']]=row['to']
              for row in payload.get('redirects',[]): aliases[row['from']]=row['to']
              pages={p.get('title'):p for p in payload.get('pages',[]) if p.get('imageinfo')}
              out={}
              for original in requested:
                  cur=original
                  seen=set()
                  while cur in aliases and cur not in seen:
                      seen.add(cur); cur=aliases[cur]
                  page=pages.get(cur)
                  if not page:
                      raise RuntimeError(f'Commons metadata missing: {original} -> {cur}')
                  out[original[5:]]=page['imageinfo'][0]
              return out

          names=[v[2] for v in targets.values()]
          metadata={}
          for i in range(0,len(names),12):
              metadata.update(api_chunk(names[i:i+12]))
              time.sleep(1.0)

          def download(url,filename):
              last=None
              for wait in (0,4,8,16,30,45):
                  if wait: time.sleep(wait)
                  resp=session.get(url,timeout=90); last=resp
                  if resp.status_code==200:return resp.content
                  if resp.status_code not in (429,500,502,503,504):resp.raise_for_status()
              raise RuntimeError(f'Download failed: {filename} status={getattr(last,"status_code",None)}')

          changed=[]
          for idx,(canonical_id,(kind,relpath,filename)) in enumerate(targets.items(),1):
              info=metadata[filename]
              meta=info.get('extmetadata',{})
              license_name=plain(meta,'LicenseShortName')
              if not license_name: raise RuntimeError(f'No reusable license metadata: {filename}')
              payload=download(info.get('thumburl') or info.get('url'),filename)
              im=ImageOps.exif_transpose(Image.open(io.BytesIO(payload))).convert('RGB')
              if max(im.size)<450: raise RuntimeError(f'Replacement too small: {filename} {im.size}')
              im.thumbnail((1800,1350),Image.Resampling.LANCZOS)
              dest=dist/relpath
              dest.parent.mkdir(parents=True,exist_ok=True)
              im.save(dest,'WEBP',quality=88,method=6)
              rec=registry[kind].get(canonical_id)
              if not rec: raise RuntimeError(f'Missing registry record: {canonical_id}')
              rec['source']=info.get('descriptionurl') or f'https://commons.wikimedia.org/wiki/File:{filename.replace(" ","_")}'
              rec['terms']=plain(meta,'LicenseUrl') or rec['source']
              rec['author']=plain(meta,'Artist')
              rec['sha256']=hashlib.sha256(dest.read_bytes()).hexdigest()
              rec['revision']=int(rec.get('revision') or 1)+1
              rec['image']=relpath
              changed.append({'id':canonical_id,'file':filename,'size':im.size,'license':license_name})
              print(f'{idx}/{len(targets)} {canonical_id} <- {filename} {im.size}',flush=True)
              time.sleep(0.7)

          registry_path.write_text(prefix+json.dumps(registry,ensure_ascii=False,indent=2)+';\n')
          Path('/tmp/semantic-food-refresh.json').write_text(json.dumps(changed,ensure_ascii=False,indent=2))

          index=dist/'index.html'
          page=index.read_text()
          page=re.sub(r'photo-registry-data\.js\?v=[^"\']+','photo-registry-data.js?v=20261007-food-semantic2',page)
          index.write_text(page)
          PY

      - name: Commit semantic food photo replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/photo-registry-data.js dist/index.html dist/images/regions
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Replace semantically poor food photos"
          git pull --rebase origin main
          git push origin HEAD:main
