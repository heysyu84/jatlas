name: Verify national canonical completion
on:
  push:
    branches: [main]
    paths:
      - 'tools/test-national-canonical-completion.cjs'
      - '.github/workflows/verify-national-canonical-completion.yml'
      - 'audits/id-migration-map.json'
      - 'audits/*-map-canonical-review.json'
      - 'dist/photo-registry-data.js'
      - 'dist/map-canonical-data.js'
      - 'dist/images/regions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all canonical photos, runtime mappings, and maps
        run: node tools/test-national-canonical-completion.cjs
