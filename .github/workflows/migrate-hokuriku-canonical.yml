name: Migrate Hokuriku canonical photos
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-hokuriku-canonical.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: jatlas-hokuriku-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install Pillow==11.3.0 Unidecode==1.4.0
      - name: Capture pre-migration runtime
        run: node tools/audit-content.cjs /tmp/hokuriku-before.json
      - name: Migrate Hokuriku photos
        run: python tools/migrate-hokuriku-canonical.py
      - name: Capture post-migration runtime
        run: node tools/audit-content.cjs /tmp/hokuriku-after.json
      - name: Declare exact runtime changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/hokuriku-before.json').read_text());after=json.loads(Path('/tmp/hokuriku-after.json').read_text())
          base=before.get('sourceCommit','') or ''
          bm={int(x['id']):x for x in before['places']};am={int(x['id']):x for x in after['places']}
          photo=[]
          for ident in sorted(set(bm)&set(am)):
              a=(bm[ident].get('photo') or {}).get('src','');b=(am[ident].get('photo') or {}).get('src','')
              if a!=b:photo.append({'id':ident,'fromSrc':a,'toSrc':b})
          hero=[]
          for key in sorted(set(before.get('heroes',{}))|set(after.get('heroes',{}))):
              a=(before.get('heroes',{}).get(key) or {}).get('src','');b=(after.get('heroes',{}).get(key) or {}).get('src','')
              if a!=b:hero.append({'key':key,'fromSrc':a,'toSrc':b})
          Path('tools/content-change-intent.json').write_text(json.dumps({'version':1,'baseCommit':'','reason':'Migrate Hokuriku to canonical IDs/paths while preserving approved images.','allow':{'placeAdds':[],'placeRemovals':[],'placeEdits':[],'photoChanges':photo,'heroChanges':hero,'canonicalPhotoChanges':[]}},ensure_ascii=False,indent=2)+'\n')
          print('Declared photoChanges=',len(photo),'heroChanges=',len(hero))
          PY
      - name: Validate generated runtime
        run: node tools/test-hokuriku-canonical-only.cjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/regions/hokuriku dist/photo-registry-data.js dist/index.html audits/hokuriku-migration-completion.json tools/content-change-intent.json
          if git diff --cached --quiet; then echo "No migration changes"; exit 0; fi
          git commit -m "Migrate Hokuriku photos to canonical structure"
      - name: Push migration
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
