name: Verify Tokai canonical-only

on:
  push:
    branches:
      - main
    paths:
      - tools/test-tokai-canonical-only.cjs
      - .github/workflows/verify-tokai-canonical-only.yml
      - dist/index.html
      - dist/photo-registry.js
      - dist/photo-registry-data.js
      - dist/images/regions/tokai/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Tokai legacy images in sandbox and verify canonical runtime
        run: node tools/test-tokai-canonical-only.cjs

      - name: Install jsdom for DOM regression
        run: npm install --prefix /tmp/jatlas-jsdom jsdom@26.1.0

      - name: Run DOM regression
        env:
          JATLAS_JSDOM: /tmp/jatlas-jsdom/node_modules/jsdom
        run: node tools/test-dom.cjs

      - name: Run non-photo regression
        env:
          JATLAS_JSDOM: /tmp/jatlas-jsdom/node_modules/jsdom
        run: node tools/test-nonphoto.cjs
