name: Normalize canonical photo slugs
on:
  push:
    branches: [main]
    paths:
      - tools/normalize-canonical-photo-slugs.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install transliterator
        run: python -m pip install pykakasi==2.3.0
      - name: Normalize canonical filenames
        run: python tools/normalize-canonical-photo-slugs.py
      - name: Verify ASCII canonical paths
        run: node tools/test-canonical-photo-paths.cjs
      - name: Commit normalized filenames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/images/regions/greater-tokyo dist/images/regions/hokuriku dist/images/regions/kinki dist/photo-registry-data.js dist/index.html audits/canonical-ascii-slug-review.json
          if git diff --cached --quiet; then echo "No slug changes"; exit 0; fi
          git commit -m "Normalize canonical photo filenames to ASCII slugs"
          git pull --rebase origin main
          git push origin HEAD:main
