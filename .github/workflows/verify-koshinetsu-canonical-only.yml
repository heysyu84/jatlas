name: Verify Koshinetsu canonical-only

on:
  push:
    branches: [main]
    paths:
      - dist/index.html
      - dist/photo-registry.js
      - dist/photo-registry-data.js
      - dist/images/regions/koshinetsu/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Koshinetsu without legacy images
        run: node tools/test-koshinetsu-canonical-only.cjs
      - name: Install DOM dependency
        run: npm install --prefix /tmp/jatlas-jsdom jsdom@26.1.0
      - name: Run DOM regression
        env:
          JATLAS_JSDOM: /tmp/jatlas-jsdom/node_modules/jsdom
        run: node tools/test-dom.cjs
