name: Find Shizuoka Hello Navi photo candidates

on:
  push:
    paths:
      - '.github/workflows/find-shizuoka-photo-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Hello Navi photo search
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            function fetchText(url) {
              return new Promise((resolve, reject) => {
                https.get(url, {headers:{'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}}, res => {
                  let data=''; res.setEncoding('utf8');
                  res.on('data', d => data += d);
                  res.on('end', () => resolve(data));
                }).on('error', reject);
              });
            }
            const strip=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/&[^;]+;/g,' ').replace(/\s+/g,' ').trim();
            for (const url of [
              'https://hellonavi.jp/photo?q=%E6%B2%B3%E6%B4%A5',
              'https://hellonavi.jp/photo?q=%E6%B2%B3%E6%B4%A5%E4%B8%83%E6%BB%9D',
              'https://hellonavi.jp/photo?q=%E5%88%9D%E6%99%AF%E6%BB%9D',
              'https://hellonavi.jp/photo?page=2',
              'https://hellonavi.jp/photo?p=2',
              'https://hellonavi.jp/photo?key=2'
            ]) {
              const html=await fetchText(url);
              const count=(html.match(/<span[^>]*>(\d+)<\/span>件ありました/)||[])[1]||'?';
              const ids=[...new Set([...html.matchAll(/href=["'][^"']*\/photo\/(\d+)["']/g)].map(m=>m[1]))];
              const titles=[...html.matchAll(/<h3[^>]*>([\s\S]*?)<\/h3>/g)].map(m=>strip(m[1])).filter(Boolean);
              console.log('PROBE',url,'COUNT',count,'IDS',ids.slice(0,50).join(','),'TITLES',JSON.stringify(titles.slice(0,45)));
            }
