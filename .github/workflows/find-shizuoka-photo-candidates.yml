name: Find Shizuoka Hello Navi photo candidates

on:
  push:
    paths:
      - '.github/workflows/find-shizuoka-photo-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search Hello Navi photo library
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            function fetchText(url) {
              return new Promise((resolve, reject) => {
                https.get(url, {headers:{'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}}, res => {
                  let data=''; res.setEncoding('utf8');
                  res.on('data', d => data += d);
                  res.on('end', () => resolve(data));
                }).on('error', reject);
              });
            }
            const strip=s=>String(s||'').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
            const terms=['釜滝','大滝','七滝','河津町','滝','MOA','MOA美術館'];
            const ids=new Set();

            for (const term of terms) {
              const url='https://hellonavi.jp/photo?q='+encodeURIComponent(term);
              const html=await fetchText(url);
              const count=(html.match(/<span[^>]*>(\d+)<\/span>件ありました/)||[])[1]||'?';
              const found=[...new Set([...html.matchAll(/href=["'][^"']*\/photo\/(\d+)["']/g)].map(m=>m[1]))];
              found.forEach(id=>ids.add(id));
              const titles=[...html.matchAll(/<h3[^>]*>([\s\S]*?)<\/h3>/g)].map(m=>strip(m[1])).filter(x=>x&&!['観光案内','当サイトについて','Language'].includes(x));
              console.log('QUERY',term,'COUNT',count,'IDS',found.join(','),'TITLES',JSON.stringify(titles));
            }

            // Also scan all 10 pages for titles containing target terms.
            for (let page=1; page<=10; page++) {
              const html=await fetchText('https://hellonavi.jp/photo?page='+page);
              const cards=[...html.matchAll(/<a[^>]*href=["'][^"']*\/photo\/(\d+)[^"']*["'][^>]*>[\s\S]*?<h3[^>]*>([\s\S]*?)<\/h3>/g)];
              for (const m of cards) {
                const id=m[1], title=strip(m[2]);
                if (terms.some(t=>title.includes(t))) {
                  ids.add(id);
                  console.log('PAGE_HIT',page,id,title);
                }
              }
            }

            const moaHash='4d0ZjjKQdklmrdJ8y5xYuoFrUnVsIA4wDTX842YO';
            for (const id of [...ids]) {
              const url='https://hellonavi.jp/photo/'+id;
              const html=await fetchText(url);
              const heading=(html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)||html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/i)||[])[1]||'';
              const title=strip(heading);
              const text=strip(html);
              const imgs=[];
              for(const m of html.matchAll(/(?:src|data-src|data-original)=["']([^"']+)["']/g)){
                const src=new URL(m[1],'https://hellonavi.jp').href;
                if(/\/storage\/photos\//.test(src)) imgs.push(src);
              }
              console.log('DETAIL',JSON.stringify({id,url,title,moaHashMatch:html.includes(moaHash),mentionsKawazu:/河津|七滝|初景滝|釜滝|大滝/.test(text),imgs:[...new Set(imgs)].slice(0,6)}));
            }
