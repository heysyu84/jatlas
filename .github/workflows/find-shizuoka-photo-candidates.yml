name: Find Shizuoka Hello Navi photo candidates

on:
  push:
    paths:
      - '.github/workflows/find-shizuoka-photo-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Crawl Hello Navi photo library
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');

            function fetchText(url) {
              return new Promise((resolve, reject) => {
                const req = https.get(url, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (compatible; Jatlas photo QA/1.0)',
                    'Accept-Language': 'ja'
                  }
                }, res => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    resolve(fetchText(new URL(res.headers.location, url).href));
                    return;
                  }
                  let data = '';
                  res.setEncoding('utf8');
                  res.on('data', d => data += d);
                  res.on('end', () => {
                    if (res.statusCode >= 200 && res.statusCode < 300) resolve(data);
                    else reject(new Error(url + ' HTTP ' + res.statusCode));
                  });
                });
                req.on('error', reject);
                req.setTimeout(20000, () => req.destroy(new Error('timeout ' + url)));
              });
            }

            const strip = s => String(s || '')
              .replace(/<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/g, ' ')
              .replace(/&amp;/g, '&')
              .replace(/&#039;/g, "'")
              .replace(/&quot;/g, '"')
              .replace(/\s+/g, ' ')
              .trim();

            const pageQueue = ['https://hellonavi.jp/photo'];
            const pageSeen = new Set();
            const detailIds = new Set();

            while (pageQueue.length) {
              const url = pageQueue.shift();
              if (pageSeen.has(url)) continue;
              pageSeen.add(url);
              const html = await fetchText(url);

              for (const m of html.matchAll(/href=["']([^"']*\/photo\/\d+[^"']*)["']/g)) {
                const u = new URL(m[1], 'https://hellonavi.jp');
                const id = u.pathname.match(/\/photo\/(\d+)/)?.[1];
                if (id) detailIds.add(id);
              }

              for (const m of html.matchAll(/href=["']([^"']*\/photo\?[^"']+)["']/g)) {
                const u = new URL(m[1], 'https://hellonavi.jp').href;
                if (!pageSeen.has(u) && !pageQueue.includes(u)) pageQueue.push(u);
              }
            }

            console.log('PHOTO_LIST_PAGES', pageSeen.size);
            console.log('DETAIL_IDS', detailIds.size);

            const ids = [...detailIds];
            const results = [];
            const needles = ['河津七滝','初景滝','釜滝','大滝','河津町','MOA美術館','MOA'];
            const moaHash = '4d0ZjjKQdklmrdJ8y5xYuoFrUnVsIA4wDTX842YO';

            for (let i = 0; i < ids.length; i += 20) {
              const batch = ids.slice(i, i + 20);
              const got = await Promise.all(batch.map(async id => {
                try {
                  const url = 'https://hellonavi.jp/photo/' + id;
                  const html = await fetchText(url);
                  const heading = (html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i) ||
                                   html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/i) || [])[1] || '';
                  const title = strip(heading);
                  const text = strip(html);
                  const imgs = [];
                  for (const m of html.matchAll(/(?:src|data-src|data-original)=["']([^"']+)["']/g)) {
                    const src = new URL(m[1], 'https://hellonavi.jp').href;
                    if (/storage\/(?:photos|tourism_attractions)\//.test(src)) imgs.push(src);
                  }
                  const hit = needles.some(n => title.includes(n) || text.includes(n)) ||
                              html.includes(moaHash);
                  if (!hit) return null;
                  return {id, url, title, imgs:[...new Set(imgs)].slice(0,10), moaHashMatch:html.includes(moaHash)};
                } catch (e) {
                  return {id, error:String(e)};
                }
              }));
              results.push(...got.filter(Boolean));
            }

            console.log('MATCHES_BEGIN');
            console.log(JSON.stringify(results, null, 2));
            console.log('MATCHES_END');
