name: Find Shizuoka Hello Navi photo candidates

on:
  push:
    paths:
      - '.github/workflows/find-shizuoka-photo-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Hello Navi photo pagination
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            function fetchText(url) {
              return new Promise((resolve, reject) => {
                https.get(url, {headers:{'User-Agent':'Mozilla/5.0','Accept-Language':'ja'}}, res => {
                  let data=''; res.setEncoding('utf8');
                  res.on('data', d => data += d);
                  res.on('end', () => resolve(data));
                }).on('error', reject);
              });
            }
            const html = await fetchText('https://hellonavi.jp/photo');
            for (const needle of ['pagination','keyword','page','axios','fetch(','photo?','form','currentPage','lastPage']) {
              let start = 0, count = 0;
              while (count < 8) {
                const i = html.toLowerCase().indexOf(needle.toLowerCase(), start);
                if (i < 0) break;
                console.log('SNIP', needle, JSON.stringify(html.slice(Math.max(0,i-600), i+1600)));
                start = i + needle.length;
                count++;
              }
            }
