name: Find Namerikawa park Commons photos

on:
  push:
    paths:
      - '.github/workflows/find-namerikawa-park-commons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            async function api(params) {
              const u = new URL('https://commons.wikimedia.org/w/api.php');
              for (const [k,v] of Object.entries(params)) u.searchParams.set(k,v);
              const res = await fetch(u,{headers:{'User-Agent':'Jatlas-photo-QA/1.0'}});
              if(!res.ok) throw new Error(String(res.status));
              return await res.json();
            }
            for (const q of ['滑川海浜公園','Namerikawa Seaside Park','滑川 海浜 公園','高塚 滑川 海岸']) {
              const data=await api({
                action:'query',format:'json',list:'search',
                srsearch:q,srnamespace:'6',srlimit:'100'
              });
              console.log('SEARCH',q,JSON.stringify((data.query?.search||[]).map(x=>({title:x.title,snippet:x.snippet})),null,2));
            }
