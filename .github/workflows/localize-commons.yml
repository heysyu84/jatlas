name: Localize Commons images

on:
  push:
    paths:
      - ".github/workflows/localize-commons.yml"
      - "scripts/localize_commons.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Download and optimize reusable Commons images
        run: python scripts/localize_commons.py

      - name: Validate JavaScript syntax
        run: |
          for f in dist/*.js; do
            node --check "$f" >/dev/null
          done

      - name: Commit localized images and paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/localized dist/data/image-localization-report.json dist/*.js
          if git diff --cached --quiet; then
            echo "No localization changes"
            exit 0
          fi
          git commit -m "Localize reusable travel photos"
          git push
