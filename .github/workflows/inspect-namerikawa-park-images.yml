name: Inspect Namerikawa park images
on:
  push:
    paths:
      - '.github/workflows/inspect-namerikawa-park-images.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official pages
        run: |
          python - <<'PY'
          import re, html, urllib.request
          pages=[
            "https://namerikawa-kanko.jp/activities/spot607/",
            "https://onedive.jp/camp/"
          ]
          for page in pages:
            req=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0"})
            txt=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
            print("PAGE",page)
            imgs=[]
            for m in re.finditer(r'<img[^>]+>',txt,re.I):
              tag=m.group(0)
              srcm=re.search(r'(?:src|data-src)=["\']([^"\']+)["\']',tag,re.I)
              altm=re.search(r'alt=["\']([^"\']*)["\']',tag,re.I)
              if not srcm: continue
              src=html.unescape(srcm.group(1))
              alt=html.unescape(altm.group(1)) if altm else ""
              if src.startswith("//"): src="https:"+src
              elif src.startswith("/"):
                from urllib.parse import urljoin
                src=urljoin(page,src)
              if "logo" in src.lower() or "icon" in src.lower(): continue
              imgs.append((alt,src))
            for alt,src in imgs:
              print("IMG",alt,"|",src)
          PY
