name: Migrate Kyushu canonical photos
on:
  push:
    branches: [main]
    paths:
      - tools/migrate-kyushu-canonical.py
      - tools/test-kyushu-canonical-only.cjs
      - .github/workflows/migrate-kyushu-canonical.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: jatlas-kyushu-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install Pillow==11.3.0 pykakasi==2.3.0
      - name: Capture current runtime
        run: node tools/audit-content.cjs /tmp/kyushu-before.json
      - name: Migrate Kyushu photos
        run: python tools/migrate-kyushu-canonical.py
      - name: Validate generated runtime
        run: node tools/test-kyushu-canonical-only.cjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/regions/kyushu dist/photo-registry-data.js dist/index.html audits/kyushu-migration-completion.json
          if git diff --cached --quiet; then echo "No migration changes"; exit 0; fi
          git commit -m "Migrate Kyushu photos to canonical structure"
      - name: Push migration
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
