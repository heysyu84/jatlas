<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Jatlas — Japan, beyond the ordinary | Video Intro</title>
<meta name="description" content="Jatlas 일본 여행 매거진 영상 인트로 시안">
<style>
:root{--ivory:#f7f4eb;--ink:#182735;--pad:clamp(23px,5.2vw,100px)}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101820;color:var(--ivory);font-family:"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}
button,a{-webkit-tap-highlight-color:transparent}
.stage{position:relative;min-height:600px;height:100svh;overflow:hidden;isolation:isolate;background:#17252d}
.backdrop{position:absolute;inset:0;background:#243039 url("images/regions/greater-tokyo/tokyo/places/13-P0010-shibuya-scramble-crossing.webp") center/cover no-repeat;transform:scale(1.02)}
.backdrop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.93) contrast(1.03);opacity:0;transition:opacity 1.6s ease}
.backdrop video.ready{opacity:1}
.backdrop:after{position:absolute;content:"";inset:0;background:linear-gradient(90deg,rgba(7,16,24,.70),rgba(7,16,24,.25) 60%,rgba(7,16,24,.16)),linear-gradient(0deg,rgba(5,9,13,.74),transparent 39%,rgba(6,13,20,.1) 74%,rgba(4,10,16,.43))}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.075;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}
.top{position:absolute;top:22px;left:var(--pad);right:var(--pad);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px}
.identity{color:var(--ivory);display:flex;align-items:center;gap:13px;text-decoration:none;font-size:23px;font-weight:700;letter-spacing:-.055em}
.identity .mark{font:italic 34px/1 Georgia,serif;letter-spacing:-.16em;margin-right:3px}
.top-side{display:flex;align-items:center;gap:32px}
.label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.86}
.toplink{display:inline-flex;align-items:center;gap:16px;padding:15px 19px;color:#182b38;background:rgba(244,243,238,.92);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(20px);text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap}
.toplink:hover{background:white}
.hero{position:absolute;z-index:3;left:var(--pad);right:var(--pad);bottom:clamp(145px,22vh,255px)}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.23em;font-weight:700;color:#e9dbca}
.eyebrow:before{content:"";width:38px;height:1px;background:currentColor}
h1{margin:26px 0 28px;max-width:890px;font-size:clamp(56px,7vw,110px);font-weight:500;letter-spacing:-.09em;line-height:1.10;word-break:keep-all;text-wrap:balance}
h1 i{font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em}
.subtitle{margin:0;color:rgba(255,255,255,.9);font-size:clamp(13px,1.25vw,18px);line-height:1.95;word-break:keep-all}
.meta-right{z-index:2;position:absolute;right:var(--pad);top:35%;writing-mode:vertical-rl;letter-spacing:.25em;font-size:10px;color:rgba(255,255,255,.7)}
.foot{position:absolute;left:var(--pad);right:var(--pad);bottom:32px;z-index:5;display:grid;grid-template-columns:minmax(130px,1fr) auto minmax(130px,1fr);align-items:center;gap:24px}
.timeline{height:2px;width:100%;background:rgba(255,255,255,.35);overflow:hidden}
.timeline i{display:block;height:100%;width:0;background:white;transition:width .2s linear}
.count{white-space:nowrap;font:17px Georgia,serif;letter-spacing:.12em}
.count span{font:11px Arial,sans-serif;letter-spacing:.19em;margin-left:17px;opacity:.85}
.controls{display:flex;align-items:center;justify-content:flex-end;gap:9px}
.ctrl{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);padding:12px 15px;cursor:pointer;font-size:11px;backdrop-filter:blur(15px)}
.ctrl:hover{background:rgba(255,255,255,.24)}
.source{position:absolute;right:var(--pad);bottom:98px;z-index:5;font-size:10px;color:rgba(255,255,255,.8);text-underline-offset:4px}
.error{display:none;position:absolute;z-index:5;left:var(--pad);top:110px;padding:12px 15px;max-width:400px;background:rgba(19,34,43,.8);border:1px solid rgba(255,255,255,.18);font-size:13px;line-height:1.6}
.error.show{display:block}
@media(max-width:780px){:root{--pad:24px}.stage{min-height:500px}.top{left:18px;right:18px;top:17px}.identity{font-size:18px}.identity .mark{font-size:30px}.top-side .label{display:none}.toplink{padding:13px 12px;font-size:11px}.hero{bottom:177px}h1{font-size:clamp(48px,11.4vw,80px);margin:20px 0 19px}.subtitle{font-size:13px;max-width:335px}.meta-right{display:none}.foot{display:flex;flex-wrap:wrap;bottom:25px;gap:15px}.timeline{width:100%;order:3}.count{flex:1}.source{bottom:117px;right:var(--pad)}}
@media(prefers-reduced-motion:reduce){.backdrop video{display:none!important}}
</style>
</head>
<body>
<main class="stage" aria-label="Jatlas 실제 여행 영상 인트로 시안">
  <div class="backdrop">
    <video id="film" muted autoplay playsinline loop preload="metadata" poster="images/regions/greater-tokyo/tokyo/places/13-P0010-shibuya-scramble-crossing.webp"><source src="media/jatlas-intro-cinematic.mp4" type="video/mp4"></video>
  </div>
  <div class="grain"></div>
  <header class="top">
    <a class="identity" href="./" aria-label="Jatlas 메인 화면으로"><span class="mark">J.</span> Jatlas</a>
    <div class="top-side"><span class="label">A Japanese travel journal</span><a class="toplink" href="./">일본 탐색하기 <span aria-hidden="true">↗</span></a></div>
  </header>
  <div class="meta-right">DISCOVER THE OTHER SIDE OF JAPAN</div>
  <section class="hero" aria-label="인트로 문구">
    <div class="eyebrow">JAPAN, FRAME BY FRAME</div>
    <h1>여행의 다음 장면을<br><i>만나다.</i></h1>
    <p class="subtitle">익숙한 풍경 너머, 오래 기억될 일본의 순간들.<br>당신만의 일본 여행, Jatlas에서 시작됩니다.</p>
  </section>
  <div class="error" id="error">영상 연결을 확인하고 있습니다. 인터넷 환경에서 다시 재생하거나 오른쪽 상단에서 기존 Jatlas를 이용할 수 있습니다.</div>
  <a class="source" href="intro-cinematic-credits.html">영상 출처 및 라이선스 ↗</a>
  <footer class="foot">
    <div class="timeline" aria-label="영상 진행률"><i id="progress"></i></div>
    <div class="count"><strong id="count">01 / 04</strong><span id="region">TOKYO</span></div>
    <div class="controls"><button class="ctrl" id="restart" type="button">처음부터 ↺</button><button class="ctrl" id="toggle" type="button" aria-label="영상 재생 일시정지">일시정지 Ⅱ</button></div>
  </footer>
</main>
<script>
(()=>{
 const v=document.getElementById("film"),count=document.getElementById("count"),region=document.getElementById("region"),progress=document.getElementById("progress"),toggle=document.getElementById("toggle"),error=document.getElementById("error");
 const scenes=["TOKYO","MT. FUJI","KUSATSU","SAKURA"];
 function update(){const d=Number.isFinite(v.duration)&&v.duration>0?v.duration:17.6;const t=(v.currentTime||0)%d;const idx=Math.min(3,Math.floor(t/(d/4)));count.textContent=String(idx+1).padStart(2,"0")+" / 04";region.textContent=scenes[idx];progress.style.width=Math.min(100,100*t/d)+"%"}
 v.addEventListener("loadeddata",()=>{v.classList.add("ready");error.classList.remove("show")});
 v.addEventListener("timeupdate",update);
 v.addEventListener("error",()=>error.classList.add("show"));
 v.addEventListener("playing",()=>{v.classList.add("ready");toggle.textContent="일시정지 Ⅱ"});
 v.addEventListener("pause",()=>{toggle.textContent="재생 ▶"});
 toggle.onclick=()=>{if(v.paused)v.play().catch(()=>error.classList.add("show"));else v.pause()};
 document.getElementById("restart").onclick=()=>{v.currentTime=0;v.play().catch(()=>error.classList.add("show"))};
 document.addEventListener("visibilitychange",()=>{if(document.hidden)v.pause();else v.play().catch(()=>{})});
 v.play().catch(()=>{toggle.textContent="재생 ▶"});
 update();
})();
</script>
</body></html>
