<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1821">
<title>Jatlas | 인트로 시안</title>
<style>
:root{color-scheme:dark;--cream:#f7f4ed;--pad:clamp(24px,5.3vw,90px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0c1b26;color:var(--cream);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{position:relative;width:100%;height:100svh;min-height:440px;overflow:hidden;isolation:isolate;background:#142631}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.55s ease-in-out;overflow:hidden}
.scene.is-active{opacity:1}
.scene img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.095) translate3d(0,0,0);transition:transform 6.8s linear;filter:saturate(.91) contrast(1.04)}
.scene.is-active img{transform:scale(1) translate3d(-.2%,0,0)}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,13,21,.73) 0%,rgba(5,15,24,.28) 55%,rgba(5,15,24,.1) 100%),linear-gradient(0deg,rgba(3,8,12,.69),transparent 43%,transparent 71%,rgba(4,13,20,.2))}
.top{position:absolute;z-index:4;top:clamp(14px,3vw,27px);left:var(--pad);right:var(--pad);min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px;background:rgba(242,244,241,.84);border:1px solid rgba(255,255,255,.32);box-shadow:0 15px 40px rgba(0,0,0,.13);border-radius:7px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#223844}
.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:11px;font-size:20px;font-weight:700;letter-spacing:-.045em}.brand img{width:32px;height:32px;object-fit:contain}
.topright{display:flex;align-items:center;gap:27px;font-size:10px;font-weight:700;letter-spacing:.14em}.topright small{opacity:.6}.topright a{color:#223844;text-decoration:none;border-bottom:1px solid #82939a;padding:5px 0;white-space:nowrap}
.copy{position:absolute;z-index:3;left:var(--pad);bottom:clamp(120px,18vh,200px);max-width:min(900px,88vw);text-shadow:0 3px 14px rgba(0,0,0,.21)}
.kicker{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.23em;font-weight:700;color:#ede2d4}.kicker:before{content:"";height:1px;width:36px;background:currentColor}
h1{font-size:clamp(50px,6.8vw,110px);font-weight:500;letter-spacing:-.08em;line-height:1.13;margin:24px 0 20px;word-break:keep-all}
h1 em{font-family:Georgia,serif;font-weight:400;font-style:italic;letter-spacing:-.02em}
.copy p{font-size:clamp(13px,1.35vw,18px);font-weight:400;line-height:1.8;opacity:.89;margin:0}
.rightnote{position:absolute;z-index:3;right:var(--pad);top:144px;writing-mode:vertical-rl;font-size:10px;letter-spacing:.22em;opacity:.8}
.bottom{position:absolute;z-index:5;left:var(--pad);right:var(--pad);bottom:30px;display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
.progress{display:flex;align-items:center;gap:8px;width:min(380px,42vw)}
.segment{height:3px;flex:1;cursor:pointer;background:rgba(255,255,255,.35);padding:0;border:0;position:relative;overflow:hidden}
.segment:before{content:"";position:absolute;inset:0;transform:scaleX(0);transform-origin:left;background:#fff}
.segment.done:before{transform:scaleX(1)}
.segment.current:before{animation:fill 5s linear forwards}
.paused .segment.current:before{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.details{display:flex;align-items:center;gap:16px;white-space:nowrap;font-size:11px;letter-spacing:.17em}.details strong{font:18px Georgia,serif;letter-spacing:0}
.control{cursor:pointer;padding:10px 14px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.58);border-radius:4px;color:white;font-size:11px;backdrop-filter:blur(10px)}
.actions{display:flex;align-items:center;gap:10px}
@media(max-width:750px){:root{--pad:22px}.top{left:14px;right:14px;min-height:57px;padding:10px 15px}.brand{font-size:17px}.brand img{width:28px;height:28px}.topright small{display:none}.copy{bottom:155px;max-width:calc(100% - 44px)}h1{font-size:clamp(45px,11vw,69px);margin:18px 0}.copy p{font-size:13px;max-width:330px}.rightnote{display:none}.bottom{flex-wrap:wrap;gap:17px;bottom:24px}.progress{order:2;width:100%}.details{font-size:10px}.actions{margin-left:auto}.scene img{object-position:55% 50%}.scene:first-child img{object-position:67% 50%}}
@media(prefers-reduced-motion:reduce){.scene,.scene img{transition:none}.scene img{transform:none!important}.segment.current:before{animation:none;transform:scaleX(1)}}
</style>
</head>
<body>
<main id="stage" aria-label="Jatlas 인트로 화면 시안">
<div class="scene is-active"><img src="images/regions/greater-tokyo/tokyo/places/13-P0013-tokyo-tower.webp" alt="도쿄 타워"></div>
<div class="scene"><img src="images/regions/koshinetsu/yamanashi/places/19-P0012-lake-kawaguchi.webp" alt="후지산과 가와구치호" loading="lazy"></div>
<div class="scene"><img src="images/regions/north-kanto/gunma/places/10-P0001-kusatsu-onsen-yubatake.webp" alt="구사쓰 온천 유바타케" loading="lazy"></div>
<div class="scene"><img src="images/regions/tokai/aichi/places/23-P0007-korankei.webp" alt="고란케이 계곡" loading="lazy"></div>
<div class="scene"><img src="images/regions/tokai/gifu/places/21-P0001-takayama-old-town.webp" alt="다카야마 옛 거리" loading="lazy"></div>
<header class="top"><a class="brand" href="./" aria-label="Jatlas 홈으로"><img src="images/jatlas-logo.webp" alt="">Jatlas</a><div class="topright"><small>THE ART OF EXPLORING JAPAN</small><a href="./">사이트로 이동 ↗</a></div></header>
<div class="rightnote">JAPAN · A TRAVEL JOURNAL</div>
<div class="copy"><div class="kicker">A JOURNEY THROUGH JAPAN</div><h1>일본을,<br>새롭게 보다<em>.</em></h1><p>익숙한 풍경 너머, 아직 만나지 못한 여행의 순간들.</p></div>
<footer class="bottom"><div class="progress" id="progress" aria-label="장면 선택"></div><div class="details"><strong id="counter">01 / 05</strong><span id="place">TOKYO · 東京</span></div><div class="actions"><button type="button" class="control" id="control" aria-label="자동 전환 일시정지">일시정지 Ⅱ</button></div></footer>
</main>
<script>
(function(){
var slides=[].slice.call(document.querySelectorAll(".scene"));
var titles=["TOKYO · 東京","YAMANASHI · 山梨","GUNMA · 群馬","AICHI · 愛知","GIFU · 岐阜"];
var bar=document.getElementById("progress"), counter=document.getElementById("counter"), place=document.getElementById("place"), ctl=document.getElementById("control"), stage=document.getElementById("stage");
var current=0,paused=false,timeout=null,buttons=[];
function show(i){
  current=(i+slides.length)%slides.length;
  slides.forEach(function(s,j){s.classList.toggle("is-active",j===current)});
  buttons.forEach(function(b,j){b.className="segment"+(j<current?" done":j===current?" current":"");});
  counter.textContent=String(current+1).padStart(2,"0")+" / 05";
  place.textContent=titles[current];
  clearTimeout(timeout);
  if(!paused&&!document.hidden)timeout=setTimeout(function(){show(current+1)},5000);
}
slides.forEach(function(_,i){var b=document.createElement("button");b.type="button";b.className="segment";b.setAttribute("aria-label",titles[i]+" 장면 보기");b.onclick=function(){show(i)};bar.appendChild(b);buttons.push(b);});
ctl.onclick=function(){paused=!paused;stage.classList.toggle("paused",paused);ctl.textContent=paused?"재생 ▶":"일시정지 Ⅱ";ctl.setAttribute("aria-label",paused?"자동 전환 재생":"자동 전환 일시정지");show(current)};
document.addEventListener("visibilitychange",function(){if(!document.hidden)show(current);else clearTimeout(timeout)});
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")show(current+1);if(e.key==="ArrowLeft")show(current-1)});
show(0);
})();
</script>
</body></html>
